<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATLAS ADO Sales &amp; Market Intelligence Suite</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#132F5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#132F5C;
  --ink-2:#1D4278;
  --ink-3:#0E2445;
  --paper:#F2F5F9;
  --card:#FFFFFF;
  --line:#D9E0EA;
  --line-soft:#E9EEF4;
  --text:#1A2233;
  --muted:#63728A;
  --tag:#F3B733;
  --tag-edge:#C9911B;
  --alert:#C0392B;
  --alert-bg:#FBECEA;
  --good:#1E7F4F;
  --good-bg:#E8F4ED;
  --warn:#A8710B;
  --warn-bg:#FCF4E2;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:76px;
}
input,select,textarea,button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;letter-spacing:-.015em;line-height:1.2}
h1{font-size:19px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
a{color:var(--ink-2)}

/* ---------- shell ---------- */
header.top{
  background:var(--ink);color:#EAF0F8;
  padding:9px 13px;display:flex;align-items:center;gap:9px;
  position:sticky;top:0;z-index:40;
}
header.top .brand{font-weight:800;letter-spacing:-.02em;font-size:15.5px;line-height:1.15}
header.top .brand small{display:block;font-weight:500;font-size:9.5px;letter-spacing:.02em;color:#9DB3D4;text-transform:uppercase}
header.top .when{margin-left:auto;font-size:12px;color:#9DB3D4;text-align:right;line-height:1.3}
.synced{background:#1F4478;border:1px solid #2F5C97;color:#9DB3D4;border-radius:999px;
  width:28px;height:28px;font-size:13px;line-height:1;padding:0;cursor:pointer;flex:none}
.synced.ok{color:#7FE0A8;border-color:#357A55}
.synced.bad{color:#F5A99A;border-color:#8A4A3E}
.synced.busy{color:var(--tag)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#0C1F3D;color:#C8DAF2;
  padding:10px 11px;border-radius:8px;overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch}
.encoder{background:#1F4478;border:1px solid #2F5C97;color:#DCE6F4;border-radius:999px;padding:4px 10px;font-size:12px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding:12px 12px 24px;max-width:1000px;margin:0 auto}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--ink);display:grid;grid-template-columns:repeat(var(--tabn,6),1fr);
  padding-bottom:env(safe-area-inset-bottom);
  border-top:1px solid #244A80;
}
nav.tabs button{
  background:none;border:0;color:#92A9CB;padding:8px 2px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:600;cursor:pointer;
}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--tag)}
@media(min-width:880px){
  body{padding-bottom:0;display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
  header.top{grid-column:1/-1}
  nav.tabs{position:sticky;top:46px;height:calc(100vh - 46px);bottom:auto;grid-template-columns:1fr;align-content:start;border-top:0;border-right:1px solid #244A80;padding:10px 8px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:13.5px;padding:10px 12px;border-radius:8px}
  nav.tabs button.on{background:#1F4478;color:#fff}
  main{padding:18px 22px 60px}
}

/* ---------- building blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:11px}
.card.tight{padding:10px 12px}
.sect-head{display:flex;align-items:center;gap:8px;margin:18px 0 9px}
.sect-head:first-child{margin-top:2px}
.sect-head .count{margin-left:auto;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:10px 0}

/* page title block, like the web version */
.pagehead{margin-bottom:12px}
.pagehead h1{font-size:20px}
.pagehead .lead{font-size:12.5px;color:var(--muted);margin-top:2px}

/* KPI tiles — the dashboard look */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px}
.kpi .lab{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  display:flex;gap:5px;align-items:flex-start;line-height:1.25;min-height:23px}
.kpi .val{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ink)}
.kpi .val small{font-size:13px;font-weight:700;letter-spacing:-.01em}
.kpi .sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.kpi.good .val{color:var(--good)}
.kpi.bad .val{color:var(--alert)}
.kpi.warn .val{color:var(--warn)}
.kpi.tap{cursor:pointer;width:100%;text-align:left}
.kpi.tap:active{transform:translateY(1px)}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.pill.g{background:var(--good-bg);color:var(--good);border-color:#BCDFCC}
.pill.r{background:var(--alert-bg);color:var(--alert);border-color:#EFC7C1}
.pill.w{background:var(--warn-bg);color:var(--warn);border-color:#EEDCAF}
.pill.n{background:#EDF1F6;color:var(--muted);border-color:var(--line)}
.pill.b{background:#E6EEFA;color:var(--ink-2);border-color:#C3D5EE}

/* brand chip — feed bag look */
.tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--tag);border:1px solid var(--tag-edge);
  color:#3D2E00;font-weight:700;font-variant-numeric:tabular-nums;
  padding:2px 9px 2px 7px;border-radius:4px 8px 8px 4px;font-size:12.5px;
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:#3D2E0033;box-shadow:inset 0 1px 0 #0002}
.tag.sm{font-size:11px;padding:1px 7px 1px 6px}
.tag.comp{background:#E3E9F1;border-color:#B6C6DA;color:#28405E}

button.btn{
  background:var(--ink-2);color:#F2F6FC;border:0;border-radius:8px;
  padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;
}
button.btn:active{transform:translateY(1px)}
button.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
button.btn.tag{background:var(--tag);color:#3D2E00}
button.btn.danger{background:#fff;color:var(--alert);border:1px solid #EFC7C1}
button.btn.sm{padding:7px 11px;font-size:13px;border-radius:7px}
button.btn.wide{width:100%}
button.link{background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
:focus-visible{outline:2.5px solid var(--ink-2);outline-offset:2px}

/* priority visit / task lines */
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.task:last-child{border-bottom:0}
.task .when{min-width:54px;font-size:11px;font-weight:700;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.task .body{flex:1;min-width:0}
.task .body .t{font-weight:600;font-size:14px}
.task .body .d{font-size:12.5px;color:var(--muted)}
.task.late{background:linear-gradient(90deg,var(--alert-bg),transparent 60%);border-left:3px solid var(--alert);padding-left:8px;margin-left:-8px}
.task.due{border-left:3px solid var(--tag);padding-left:8px;margin-left:-8px}
.task.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}

/* the target panel — the one loud element */
.aiwin{background:var(--ink);color:#E9F0F9;border-radius:var(--radius);padding:14px;margin-bottom:11px;border:1px solid #244A80}
.aiwin .lbl{font-size:12px;color:#9DB3D4}
.aiwin .clock{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0 1px}
.aiwin.open{background:#15452C;border-color:#2C7A4C}
.aiwin.open .clock{color:#B6F0C9}
.aiwin.hot{background:#5A1F17;border-color:#8E3A2B}
.aiwin.hot .clock{color:#FFC7B9}
.aiwin .win{font-size:13px;color:#C3D5EE}
.aiwin .row{margin-top:9px}
.aiwin .bar{background:#0D2549}
.aiwin .bar i{background:var(--tag)}

.listitem{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:7px;cursor:pointer;width:100%;text-align:left}
.listitem .meta{flex:1;min-width:0}
.listitem .meta .l1{font-weight:600;font-size:14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.listitem .meta .l2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listitem .chev{color:#9FAEC3;font-size:18px}
.listitem .av{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--tag);
  display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.listitem .av.comp{background:#E3E9F1;color:var(--ink)}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}
table.tbl td{padding:7px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* timeline */
.tl{position:relative;padding-left:20px;margin:4px 0}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .n{position:relative;padding:6px 0}
.tl .n::before{content:"";position:absolute;left:-18px;top:12px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl .n.ok::before{background:var(--good);border-color:var(--good)}
.tl .n.now::before{background:var(--tag);border-color:var(--tag-edge)}
.tl .n .t{font-weight:600;font-size:13.5px}
.tl .n .s{font-size:12px;color:var(--muted)}

/* forms + modal */
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;
}
.field textarea{min-height:66px;resize:vertical}
.modal-bg{position:fixed;inset:0;background:#0A1B33AA;z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 15px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{border-radius:14px}}
.modal h2{margin-bottom:3px}
.modal .sub{font-size:12.5px;color:var(--muted);margin-bottom:13px}
.modal .acts{display:flex;gap:9px;margin-top:14px}
.modal .acts button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#EAF0F8;padding:10px 16px;border-radius:999px;z-index:200;font-size:13.5px;max-width:88vw;text-align:center;box-shadow:0 6px 20px #0003}
@media(min-width:880px){.toast{bottom:26px}}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:3px}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px}
.chipbar button{white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.chipbar button.on{background:var(--ink-2);color:#fff;border-color:var(--ink-2)}
.backlink{background:none;border:0;color:var(--muted);font-size:13px;padding:0 0 8px;cursor:pointer;font-weight:600}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.w{background:var(--tag)}
.bar i.r{background:var(--alert)}
.adobar{display:flex;gap:8px;align-items:center;margin-bottom:11px}
.adobar select{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.adobar label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- sign in ---------- */
body.out{padding-bottom:0;background:var(--ink)}
body.out header.top{display:none}
body.out nav.tabs{display:none}
body.out main{max-width:none;padding:0}
@media(min-width:880px){body.out{grid-template-columns:1fr;display:block}}
.signin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.signin .box{width:100%;max-width:400px}
.signin .logo{display:block;width:120px;max-width:44%;margin:0 auto 16px;border-radius:12px}
.signin .card{padding:20px 18px}
.signin h1{font-size:17px;text-align:center;color:var(--ink);letter-spacing:-.01em}
.signin .strap{text-align:center;font-size:10.5px;color:var(--muted);margin:5px 0 16px;line-height:1.45}
.signin .lead{color:var(--muted);font-size:13px;margin-bottom:14px}
.signin .foot{text-align:center;margin-top:14px;color:#9DB3D4;font-size:12.5px}
.signin .foot button.link{color:#BFD2EC}
.utile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer}
.utile .av{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--tag);
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.utile .nm{font-weight:600;font-size:15px}
.utile .rl{font-size:12px;color:var(--muted)}
.roletag{display:inline-block;background:#1F4478;color:#CFDDF0;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600}

/* ---------- v2 additions: hierarchy, scorecard, matrix ---------- */
.crumb{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb b{color:var(--ink)}
.matrix{width:100%;border-collapse:collapse;font-size:12.5px}
.matrix th{position:sticky;left:0;background:var(--card)}
.matrix th,.matrix td{padding:6px 7px;border-bottom:1px solid var(--line-soft);text-align:right;font-variant-numeric:tabular-nums}
.matrix th:first-child,.matrix td:first-child{text-align:left;font-weight:600}
.matrix thead th{text-align:right;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);position:static}
.matrix td.us{background:var(--good-bg);font-weight:700;color:var(--good)}
.scorewrap{display:flex;gap:14px;align-items:center}
.ring{width:74px;height:74px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--tag) calc(var(--p,0)*1%), #24467A 0);position:relative}
.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--ink)}
.ring b{position:relative;z-index:1;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.03em}
.medal{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700;border:1px solid}
.medal.platinum{background:#E7EDF5;color:#2B4A72;border-color:#BACBE2}
.medal.gold{background:#FBF1D6;color:#8A6A10;border-color:#E6CE8A}
.medal.silver{background:#EFF1F4;color:#5A6474;border-color:#CFD5DE}
.medal.bronze{background:#F6EADF;color:#7C5230;border-color:#DFC3A6}
.medal.none{background:var(--alert-bg);color:var(--alert);border-color:#EFC7C1}
.comprow{padding:6px 0}
.comprow .spread{font-size:12.5px}
.herdline{display:grid;grid-template-columns:1fr 62px 1fr 30px;gap:6px;align-items:center;margin-bottom:6px}
.saleline{display:grid;gap:6px;align-items:center;grid-template-columns:1fr 64px 100px 1fr 26px;
  padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.saleline select,.saleline input{padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13.5px;width:100%}
.saleline .sx{background:none;border:0;color:var(--alert);font-size:17px;cursor:pointer;padding:0}
.salehead{display:grid;gap:6px;grid-template-columns:1fr 64px 100px 1fr 26px;
  padding:0 8px 4px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){
  .saleline{grid-template-columns:1fr 1fr 26px}
  .saleline .ss{grid-column:1 / span 2}
  .saleline .sbr{grid-column:1 / span 2}
  .saleline .sx{grid-row:1;grid-column:3;justify-self:end}
  .salehead{display:none}
}
.saletotal{display:flex;justify-content:space-between;align-items:baseline;padding:11px 12px;
  background:var(--ink);color:#EAF0F8;border-radius:9px;margin-top:4px}
.saletotal b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.herdline select,.herdline input{padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13.5px;width:100%}
.herdline button{background:none;border:0;color:var(--alert);font-size:17px;cursor:pointer;padding:0}
.stagebar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin-top:6px;background:var(--line-soft)}
.stagebar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.note{background:#FFFDF5;border:1px solid #EEDCAF;border-radius:var(--radius);padding:11px 12px;margin-bottom:8px}
.note .who{font-size:11px;color:var(--warn);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand">ATLAS ADO<small id="brandsub">Sales &amp; Market Intelligence</small></div>
  <button class="encoder" id="encoderBtn">Not signed in</button>
  <button class="synced" id="syncBtn" title="Cloud sync">○</button>
  <div class="when" id="todayLbl"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="modalHost"></div>
<script>
/* ============================================================
   ATLAS ADO SALES & MARKET INTELLIGENCE SUITE  v2
   Manager \u2192 Supervisor \u2192 ADO / Technician
   Area profiling \u00b7 herd-level market sizing \u00b7 scorecards \u00b7 rewards
   ============================================================ */
const KEY='atlas_v2';
const DAY=86400000, HR=3600000;

/* ---------- herd stages: the heart of market sizing ----------
   Heads per stage x bags a head eats a month = the real prize.
   Every line also carries the brand actually being fed, so the

/* ---------- storage ---------- */
async function load(){
  let raw=null;
  try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value) raw=r.value; } }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(raw){ try{ db=Object.assign(blank(), JSON.parse(raw)); }catch(e){} }
  if(!db.meta.rates) db.meta.rates=Object.assign({},DEFRATE);
  if(!db.meta.prices) db.meta.prices={};
  /* Starter used to cover weanlings too. Split apart, the new stage starts on
     whatever the old combined line was, for us and for every rival. */
  if(db.meta.rates&&db.meta.rates.weanling==null) db.meta.rates.weanling=DEFRATE.weanling;
  if(db.meta.prices&&db.meta.prices.weanling==null&&db.meta.prices.starter!=null)
    db.meta.prices.weanling=db.meta.prices.starter;
  db.competitors.forEach(c=>{ if(c.prices&&c.prices.weanling==null&&c.prices.starter!=null)
    c.prices.weanling=c.prices.starter; });
  /* an older file kept one flat price \u2014 spread it across the stages once */
  if(!Object.keys(db.meta.prices).length&&num(db.meta.pricePerBag))
    STAGES.forEach(([k])=>db.meta.prices[k]=num(db.meta.pricePerBag));
  db.competitors.forEach(c=>{ if(!c.prices){ c.prices={};
    if(num(c.price)) STAGES.forEach(([k])=>c.prices[k]=num(c.price)); } });
  if(!Array.isArray(db.issues)) db.issues=[];
  if(db.meta.weights&&db.meta.weights.service===undefined) db.meta.weights.service=10;
  if(!db.meta.askGapDays) db.meta.askGapDays=60;
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
function todayISO(d){const t=d?new Date(d):new Date();return new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function startOf(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(iso){ if(!iso) return '\u2014'; const d=new Date(iso); if(isNaN(d)) return '\u2014';
  return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function fshort(iso){ if(!iso) return '\u2014'; const d=new Date(iso); if(isNaN(d)) return '\u2014'; return MON[d.getMonth()]+' '+d.getDate(); }
function ftime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  let h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'), ap=h<12?'am':'pm'; h=h%12||12; return h+':'+m+ap; }
function addD(iso,n){ const d=new Date(iso); d.setDate(d.getDate()+n); return todayISO(d); }
function dDiff(a,b){ return Math.round((startOf(b)-startOf(a))/DAY); }
function fromToday(iso){ return dDiff(todayISO(), iso); }
function daysSince(iso){ return iso? dDiff(iso, todayISO()) : null; }
function peso(n){ return '\u20B1'+(Math.round(num(n)*100)/100).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2}); }

function whenTxt(iso){ const n=fromToday(iso);

  return n<0? (Math.abs(n)+'d late') : ('+'+n+'d'); }

function initials(s){ return String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }

/* ============================================================
   THE HIERARCHY
   Manager (admin) \u2192 Supervisor (one area) \u2192 ADO / technician
   Every record carries adoId. An ADO belongs to an area, so the
   area a record belongs to is read off its ADO.
   ============================================================ */
const ROLE={
  manager:    {label:'Area Manager', short:'Manager',
               blurb:'Runs the whole operation. Areas, supervisors, targets, rewards, settings.',
               tabs:['dash','team','cust','market','more'], can:'*'},
  supervisor: {label:'Supervisor', short:'Supervisor',
               blurb:'Runs one area. Guides the ADOs under them, scores their work, proposes rewards.',
               tabs:['dash','team','cust','market','more'],
               can:['customers','sales','visits','market','reports','team','coach','propose','targets','issues','demand']},
  ado:        {label:'ADO / Technician', short:'ADO',
               blurb:'Works one territory. Profiles the market, sells, visits, follows up.',
               tabs:['dash','cust','sales','field','market','more'],
               can:['customers','sales','visits','market','reports','ownscore','issues']},
  encoder:    {label:'Encoder', short:'Encoder',
               blurb:'Types in sales and visits for somebody else. Changes nothing else.',
               tabs:['dash','sales','field','more'], can:['sales','visits','issues']},
  viewer:     {label:'Viewer', short:'Viewer',
               blurb:'Reads dashboards and reports. Records nothing.',
               tabs:['dash','cust','market','more'], can:['reports','demand']}
};
let SESSION=null;
const role=()=>SESSION?SESSION.role:'';
const who=()=>SESSION?SESSION.name:(db.meta.encoder||'');
function can(p){ const r=ROLE[role()]; if(!r) return false; return r.can==='*'||r.can.includes(p); }
const isManager=()=>role()==='manager';
const isSup=()=>role()==='supervisor';
const isBoss=()=>isManager()||isSup();
function myArea(){ const u=userOf(SESSION?SESSION.id:''); return u?u.areaId:''; }

function adosAll(){ return db.users.filter(u=>u.role==='ado'&&u.active!==false); }
function adosInArea(aid){ return adosAll().filter(u=>u.areaId===aid); }
function supOfArea(aid){ const a=areaOf(aid); return a&&a.supervisorId?userOf(a.supervisorId):null; }
function myAreaId(){
  if(isManager()) return AREAF==='all'?null:AREAF;
  if(isSup()) return myArea()||'__none__';
  if(role()==='ado'){ const u=userOf(SESSION.id); return u?u.areaId:null; }
  return null;
}
/* the set of ADO ids the current screen is allowed to show; null = everybody */
function allowedAdos(){
  if(role()==='ado') return [SESSION.id];
  if(role()==='encoder'||role()==='viewer'){
    const u=userOf(SESSION.id);
    if(u&&u.areaId) return adosInArea(u.areaId).map(x=>x.id);
    return null;
  }
  let list;
  if(isSup()) list=adosInArea(myArea()).map(u=>u.id);
  else list = AREAF==='all' ? null : adosInArea(AREAF).map(u=>u.id);
  if(ADOF!=='all'){
    if(!list || list.includes(ADOF)) return [ADOF];
    return list;
  }
  return list;
}
function inScope(rec){
  const a=allowedAdos();
  if(!a) return true;
  return a.includes(rec.adoId||'');
}
function scopeLabel(){
  if(role()==='ado') return SESSION.name;
  if(ADOF!=='all') return adoName(ADOF);
  if(isSup()) return areaName(myArea())+' area';
  return AREAF==='all'? 'All areas' : areaName(AREAF)+' area';
}
function areaOfAdo(id){ const u=userOf(id); return u?u.areaId:''; }
/* A raiser often buys from a store that belongs to another ADO's round. The
   supply link has to reach across the area, or half of them read as "direct". */
function areaScopeAdos(){
  if(isManager()) return AREAF==='all'? null : adosInArea(AREAF).map(u=>u.id);
  const a = isSup()? myArea() : (userOf((SESSION||{}).id)||{}).areaId;
  if(!a) return allowedAdos();

}
function dealerChoices(excludeId, brgyId){

      return {c, rank:(c.brgyId&&c.brgyId===brgyId)?0:((b.town&&bg.town&&b.town===bg.town)?1:2),
        label:c.name+' \u2014 '+(b.name||'no barangay')+(b.town&&b.town!==b.name?', '+b.town:'')}; })

/* ============================================================
   MARKET SIZING FROM THE HERD
   ============================================================ */
function rate(stage){ const r=db.meta.rates||DEFRATE; return num(r[stage]!=null?r[stage]:DEFRATE[stage]); }
/* What a bag costs, by stage. A finisher bag and a lactating bag are not the
   same money, and the stage where we undercut them is the cheapest way in. */
function ourPrice(stage){
  const p=db.meta.prices||{};
  return num(p[stage]!=null&&p[stage]!==''?p[stage]:db.meta.pricePerBag);
}
function compRec(brand){
  const q=String(brand||'').trim().toLowerCase();
  return db.competitors.find(x=>(x.brand||'').toLowerCase()===q)||null;
}
function brandPrice(brand,stage){
  if(isOurs(brand)) return ourPrice(stage);
  const c=compRec(brand); if(!c) return 0;
  const p=c.prices||{};
  return num(p[stage]!=null&&p[stage]!==''?p[stage]:c.price);
}
function avgOurPrice(){
  const v=STAGES.map(([k])=>ourPrice(k)).filter(x=>x>0);
  return v.length? v.reduce((a,b)=>a+b,0)/v.length : num(db.meta.pricePerBag);
}
/* value a herd at our own prices, split between what is ours and what is not */
function herdValue(c){
  let ours=0,rival=0;
  herdOf(c).forEach(l=>{ const v=num(l.heads)*rate(l.stage)*ourPrice(l.stage);
    if(isOurs(l.brand)) ours+=v; else rival+=v; });
  return {ours,rival,tot:ours+rival};
}
function scopeValue(){
  let ours=0,rival=0;
  scopedCustomers().filter(c=>c.isRaiser&&c.status!=='prospect').forEach(c=>{
    const v=herdValue(c); ours+=v.ours; rival+=v.rival; });
  return {ours,rival,tot:ours+rival};
}
function herdOf(c){ return (c&&Array.isArray(c.herd))?c.herd:[]; }
/* Every brand name anybody has typed anywhere \u2014 the competitor file, a herd
   line, or a dealer's "brands carried" list. One place, so the suggestions on
   the herd screen already know what the dealer down the road is carrying. */
function splitBrands(str){ return String(str||'').split(/[,;/]+/).map(x=>x.trim()).filter(Boolean); }
function knownBrands(){
  const set=new Map();
  const add=b=>{ const t=String(b||'').trim(); if(!t) return;
    const k=t.toLowerCase(); if(!set.has(k)) set.set(k,t); };
  add(ourBrand());
  db.competitors.forEach(c=>add(c.brand));
  db.customers.forEach(c=>{ herdOf(c).forEach(l=>add(l.brand)); splitBrands(c.brands).forEach(add); });
  const all=[...set.values()];
  const ours=all.filter(b=>isOurs(b)), rest=all.filter(b=>!isOurs(b)).sort((a,b)=>a.localeCompare(b));
  return ours.concat(rest);
}
function headCount(c){ return herdOf(c).reduce((a,l)=>a+num(l.heads),0); }
function sowCount(c){ return herdOf(c).filter(l=>l.stage==='sow_g'||l.stage==='sow_l').reduce((a,l)=>a+num(l.heads),0); }
/* bags a month this farm eats, all brands */
function herdBags(c){ return herdOf(c).reduce((a,l)=>a+num(l.heads)*rate(l.stage),0); }
/* bags a month by brand for one farm */
function herdByBrand(c){
  const out={};
  herdOf(c).forEach(l=>{ const b=(l.brand||ourBrand()).trim()||ourBrand();
    out[b]=(out[b]||0)+num(l.heads)*rate(l.stage); });
  return out;
}
function ourShareOf(c){
  const by=herdByBrand(c); let ours=0, tot=0;
  Object.entries(by).forEach(([b,v])=>{ tot+=v; if(isOurs(b)) ours+=v; });
  return {ours, tot, pct:pct(ours,tot)};
}
/* a dealer's own monthly throughput: what they say, or what their raisers imply */
function dealerBags(c){
  if(num(c.dealerBags)) return num(c.dealerBags);
  return db.customers.filter(x=>x.buysFrom===c.id).reduce((a,x)=>a+herdBags(x),0);
}
function dealerByBrand(c){
  const out={};
  const listed=splitBrands(c.brands);
  if(num(c.dealerBags)&&listed.length){
    const each=num(c.dealerBags)/listed.length;
    listed.forEach(b=>out[b]=(out[b]||0)+each);
    return out;
  }
  db.customers.filter(x=>x.buysFrom===c.id).forEach(x=>{
    const by=herdByBrand(x); Object.entries(by).forEach(([b,v])=>out[b]=(out[b]||0)+v);
  });
  return out;
}
/* roll a brand table up over any list of customers */
function brandTable(list){
  const out={};
  list.forEach(c=>{ if(!c.isRaiser) return;
    Object.entries(herdByBrand(c)).forEach(([b,v])=>out[b]=(out[b]||0)+v); });
  return Object.entries(out).sort((a,b)=>b[1]-a[1]);
}
function scopedCustomers(){ return db.customers.filter(inScope); }
function brgyScoped(){ return db.barangays.filter(inScope); }

/* ============================================================
   CUSTOMER STATE + KPIs
   ============================================================ */
function custSales(cid){ return db.sales.filter(s=>s.custId===cid).sort((a,b)=>b.date.localeCompare(a.date)); }
function lastSale(cid){ return custSales(cid)[0]||null; }
function lastVisit(cid){ return db.visits.filter(v=>v.custId===cid).sort((a,b)=>b.date.localeCompare(a.date))[0]||null; }
function bagsBetween(cid,a,b){ return db.sales.filter(s=>s.custId===cid&&s.date>=a&&s.date<=b).reduce((x,s)=>x+num(s.bags),0); }
function custState(c){
  if(c.status==='prospect'){
    const h=c.heat||'warm';
    return h==='hot'?{k:'HOT',label:'Hot prospect',cls:'r'}
         : h==='warm'?{k:'WARM',label:'Warm prospect',cls:'w'}
         :{k:'COLD',label:'Cold prospect',cls:'n'};
  }
  if(c.status==='lost') return {k:'LOST',label:'Lost to competitor',cls:'r'};
  if(c.status==='closed') return {k:'CLOSED',label:'Closed / inactive',cls:'n'};
  const ls=lastSale(c.id);
  if(!ls) return {k:'NEW',label:'No purchase yet',cls:'n'};
  const gap=daysSince(ls.date), stale=num(db.meta.staleDays)||45;
  if(gap>stale) return {k:'DORMANT',label:'Dormant \u2014 '+gap+'d no order',cls:'r',sub:'Last: '+fshort(ls.date)};
  const t=todayISO();
  const now=bagsBetween(c.id,addD(t,-30),t), prev=bagsBetween(c.id,addD(t,-60),addD(t,-31));
  const drop=num(db.meta.declinePct)||25;
  if(prev>0&&now<prev*(1-drop/100))
    return {k:'DECLINING',label:'Declining \u2014 '+Math.round((1-now/prev)*100)+'% down',cls:'w',
            sub:nf(prev)+' \u2192 '+nf(now)+' bags'};
  if(prev>0&&now>prev*1.2) return {k:'GROWING',label:'Growing',cls:'g',sub:'Last: '+fshort(ls.date)};
  return {k:'ACTIVE',label:'Active',cls:'g',sub:'Last: '+fshort(ls.date)};
}
function isActive(c){ return ['ACTIVE','GROWING','DECLINING'].includes(custState(c).k); }
/* somebody is a competitor user when any part of the herd is on another brand */
function onCompetitor(c){
  if(c.status==='prospect') return false;
  if(c.isRaiser){ const s=ourShareOf(c); if(s.tot>0&&s.pct<100) return true; }
  if(c.isDealer){ const b=splitBrands(c.brands); if(b.length&&!b.every(isOurs)) return true; }
  return false;
}
function salesScoped(month){
  return db.sales.filter(s=>inScope(s)&&(!month||monthOf(s.date)===month));
}
function targetFor(month,adoIds){
  const t=db.targets.filter(x=>x.month===month&&(!adoIds||adoIds.includes(x.adoId)));
  return {bags:t.reduce((a,x)=>a+num(x.bags),0), amount:t.reduce((a,x)=>a+num(x.amount),0)};
}
function scopedTarget(month){
  const a=allowedAdos();
  const t=db.targets.filter(x=>x.month===month&&(!a||a.includes(x.adoId)));
  return {bags:t.reduce((x,y)=>x+num(y.bags),0), amount:t.reduce((x,y)=>x+num(y.amount),0)};
}
function kpis(month){
  const m=month||thisMonth();
  const sales=salesScoped(m), tg=scopedTarget(m);
  const actual=sales.reduce((x,s)=>x+num(s.bags),0);
  const amount=sales.reduce((x,s)=>x+num(s.amount),0);
  const cust=scopedCustomers();
  const deals=cust.filter(c=>c.isDealer&&c.status!=='prospect');
  const rais=cust.filter(c=>c.isRaiser&&c.status!=='prospect');
  const pros=cust.filter(c=>c.status==='prospect');
  const buyers=[...new Set(sales.map(s=>s.custId))];
  const newCust=buyers.filter(id=>{const all=custSales(id);
    return all.length&&monthOf(all[all.length-1].date)===m;}).length;
  const repeat=buyers.filter(id=>custSales(id).length>1).length;
  const covered=[...new Set(cust.filter(isActive).map(c=>c.brgyId).filter(Boolean))];
  const brgyTotal=brgyScoped().length;
  const followDue=db.followups.filter(f=>inScope(f)&&f.status!=='done'&&f.due<=todayISO()).length;
  const declining=cust.filter(c=>c.status!=='prospect'&&['DECLINING','DORMANT'].includes(custState(c).k)).length;
  /* market size straight from the herds */
  const potential=rais.reduce((a,c)=>a+herdBags(c),0);
  const ours=rais.reduce((a,c)=>a+ourShareOf(c).ours,0);
  return {month:m, target:tg.bags, targetAmount:tg.amount, actual, amount,
    achieve:pct(actual,tg.bags),
    dealers:deals.filter(isActive).length, dealersAll:deals.length,
    raisers:rais.filter(c=>isActive(c)&&ourShareOf(c).pct>0).length, raisersAll:rais.length,
    both:cust.filter(c=>c.isDealer&&c.isRaiser).length,
    newCust, repeat, mapped:rais.length,
    heads:rais.reduce((a,c)=>a+headCount(c),0),
    sows:rais.reduce((a,c)=>a+sowCount(c),0),
    brgyCovered:covered.length, brgyTotal, coverage:pct(covered.length,brgyTotal),
    compUsers:cust.filter(onCompetitor).length,
    hot:pros.filter(p=>(p.heat||'warm')==='hot').length,
    followDue, declining,
    opps:db.opps.filter(o=>inScope(o)&&o.stage!=='won'&&o.stage!=='lost').length,
    oppValue:db.opps.filter(o=>inScope(o)&&o.stage!=='won'&&o.stage!=='lost').reduce((x,o)=>x+num(o.bags),0),
    potential:Math.round(potential), ours:Math.round(ours), share:pct(ours,potential),
    gap:Math.round(potential-ours)};
}

/* ---------- priority visits ---------- */
function priorityVisits(limit){
  const out=[], t=todayISO(), gapDays=num(db.meta.visitGapDays)||30;
  db.followups.filter(f=>inScope(f)&&f.status!=='done'&&f.due<=t).forEach(f=>{
    const late=-fromToday(f.due);
    out.push({score:900+late, custId:f.custId, ref:f.id, kind:'followup', title:custName(f.custId)||f.what,
      why:(late>0?late+' days overdue \u2014 ':'Due today \u2014 ')+(f.what||'follow-up'), date:f.due});
  });
  db.issues.filter(i=>inScope(i)&&i.status!=='resolved'&&i.severity==='high').forEach(i=>{
    out.push({score:880, custId:i.custId, ref:i.id, kind:'issue', title:custName(i.custId),
      why:'URGENT \u2014 '+(ISSUECAT[i.cat]||i.cat)+(i.needKind?'. Needs '+(NEEDKIND[i.needKind]||i.needKind).toLowerCase():'')});
  });
  const askGap=num(db.meta.askGapDays)||60;
  scopedCustomers().forEach(c=>{
    const st=custState(c), lv=lastVisit(c.id), since=lv?daysSince(lv.date):null;
    const sh=c.isRaiser?ourShareOf(c):null;
    if(st.k==='DORMANT')
      out.push({score:800,custId:c.id,kind:'dormant',title:c.name,
        why:'No order in '+daysSince((lastSale(c.id)||{}).date)+' days. Win them back.'});
    else if(st.k==='DECLINING')
      out.push({score:700,custId:c.id,kind:'declining',title:c.name,why:st.label+'. '+(st.sub||'')+' \u2014 find out why.'});
    else if(st.k==='HOT')
      out.push({score:650,custId:c.id,kind:'hot',title:c.name,
        why:'Hot prospect'+(c.isRaiser&&herdBags(c)?' \u00b7 '+nf(herdBags(c))+' bags/mo on the table':'')});
    else if(onCompetitor(c))
      out.push({score:500+(sh?Math.min(200,Math.round(sh.tot-sh.ours)):0),custId:c.id,kind:'competitor',title:c.name,
        why:sh&&sh.tot?nf(sh.tot-sh.ours)+' bags/mo still with rivals ('+sh.pct+'% ours)':'Carries a rival brand. Switchable.'});
    else if(since==null&&c.status!=='prospect')
      out.push({score:400,custId:c.id,kind:'never',title:c.name,why:'Never visited yet.'});
    else if(c.isRaiser&&c.status!=='prospect'&&(!c.askedAt||daysSince(c.askedAt)>askGap))
      out.push({score:350,custId:c.id,kind:'checkin',title:c.name,
        why:c.askedAt?'Not asked what they need in '+daysSince(c.askedAt)+' days.':'Never asked what they need.'});
    else if(since!=null&&since>gapDays)
      out.push({score:300+Math.min(since,120),custId:c.id,kind:'stale',title:c.name,why:'Not visited in '+since+' days.'});
  });
  const seen=new Set(), rank=[];
  out.sort((a,b)=>b.score-a.score).forEach(x=>{const k=x.custId||x.ref; if(seen.has(k))return; seen.add(k); rank.push(x);});
  return limit?rank.slice(0,limit):rank;
}

/* ============================================================
   THE SCORECARD  \u2014 the basis for guidance and rewards
   Six parts, weighted, out of 100. Every part is read from the
   records, so nobody can talk their way into a better number.
   ============================================================ */
const COMP=[
  ['target','Target achievement','Bags sold against the bags promised'],
  ['newc','New customers','First-time buyers opened this month'],
  ['switch','Switch wins','Rival volume converted to our brand'],
  ['coverage','Territory coverage','Barangays with a live buyer'],
  ['activity','Field activity','Visits made against the monthly quota'],
  ['follow','Follow-through','Follow-ups closed on time'],
  ['service','Customer care','Raisers actually asked what they need']
];
function adoStats(adoId,m){
  const month=m||thisMonth();
  const sales=db.sales.filter(s=>s.adoId===adoId&&monthOf(s.date)===month);
  const bagsN=sales.reduce((a,s)=>a+num(s.bags),0);
  const tg=targetFor(month,[adoId]);
  const cust=db.customers.filter(c=>c.adoId===adoId);
  const brgy=db.barangays.filter(b=>b.adoId===adoId);
  const covered=[...new Set(cust.filter(isActive).map(c=>c.brgyId).filter(Boolean))];
  const visits=db.visits.filter(v=>v.adoId===adoId&&monthOf(v.date)===month);
  const buyers=[...new Set(sales.map(s=>s.custId))];
  const newC=buyers.filter(id=>{const all=custSales(id);
    return all.length&&monthOf(all[all.length-1].date)===month;}).length;
  /* only follow-ups that have actually come due count against them */
  const fu=db.followups.filter(f=>f.adoId===adoId&&monthOf(f.due)===month&&
    (f.status==='done'||f.due<=todayISO()));
  const closedOnTime=fu.filter(f=>f.status==='done'&&(!f.doneAt||todayISO(f.doneAt)<=f.due)).length;
  const overdue=db.followups.filter(f=>f.adoId===adoId&&f.status!=='done'&&f.due<todayISO()).length;
  const wins=db.opps.filter(o=>o.adoId===adoId&&o.stage==='won'&&monthOf(o.close||'')===month);
  const switchBags=wins.reduce((a,o)=>a+num(o.bags),0);
  const rais=cust.filter(c=>c.isRaiser&&c.status!=='prospect');
  const potential=rais.reduce((a,c)=>a+herdBags(c),0);
  const ours=rais.reduce((a,c)=>a+ourShareOf(c).ours,0);
  /* customer care: did they actually sit down and ask? */
  const gapA=num(db.meta.askGapDays)||60;
  const checkins=rais.filter(c=>monthOf(c.askedAt||'')===month).length;
  const expected=Math.max(1,Math.round(rais.length*30/gapA));
  const iss=db.issues.filter(i=>i.adoId===adoId);
  const issMonth=iss.filter(i=>monthOf(i.date)===month);
  return {adoId, month, bags:bagsN,
    checkins, expected, overdueAsk:rais.filter(c=>!c.askedAt||daysSince(c.askedAt)>gapA).length,
    issuesOpen:iss.filter(i=>i.status!=='resolved').length,
    issuesLogged:issMonth.length, issuesResolved:iss.filter(i=>i.status==='resolved'&&monthOf(i.resolvedAt||'')===month).length,
    needsOpen:iss.filter(i=>i.needKind&&i.status!=='resolved').length, amount:sales.reduce((a,s)=>a+num(s.amount),0),
    target:tg.bags, ach:pct(bagsN,tg.bags), cust:cust.length, active:cust.filter(isActive).length,
    brgy:brgy.length, covered:covered.length, coverage:pct(covered.length,brgy.length),
    visits:visits.length, quota:num(db.meta.visitQuota)||40,
    newC, switchBags, switchWins:wins.length,
    fuTotal:fu.length, fuClosed:closedOnTime, overdue,
    mapped:rais.length, heads:rais.reduce((a,c)=>a+headCount(c),0),
    potential:Math.round(potential), ours:Math.round(ours), share:pct(ours,potential)};
}
function scorecard(adoId,m){
  const s=adoStats(adoId,m);
  const W=db.meta.weights||{target:40,newc:15,switch:15,coverage:10,activity:10,follow:10};
  const prev=adoStats(adoId,prevMonth(m||thisMonth()));
  const capped=v=>Math.max(0,Math.min(1,v));
  const parts={};
  parts.target={pts:Math.round(capped(s.target? s.bags/s.target : 0)*W.target), max:W.target,
    detail:nf(s.bags)+' of '+nf(s.target)+' bags \u00b7 '+s.ach+'%'};
  /* full marks at the bar set in Settings \u2014 thin areas should use a lower one */
  parts.newc={pts:Math.round(capped(s.newC/(num(db.meta.newcTarget)||3))*W.newc), max:W.newc,
    detail:s.newC+' new buyer'+(s.newC===1?'':'s')+' this month'};
  parts.switch={pts:Math.round(capped(s.switchBags/(num(db.meta.switchTarget)||50))*W.switch), max:W.switch,
    detail:s.switchWins?s.switchWins+' win'+(s.switchWins===1?'':'s')+' \u00b7 '+nf(s.switchBags)+' bags/mo converted':'no switch wins closed'};
  parts.coverage={pts:Math.round(capped(s.coverage/100)*W.coverage), max:W.coverage,
    detail:s.covered+' of '+s.brgy+' barangays live \u00b7 '+s.coverage+'%'};
  parts.activity={pts:Math.round(capped(s.visits/(s.quota||1))*W.activity), max:W.activity,
    detail:s.visits+' visits of a '+s.quota+' quota'};
  const fuRate=s.fuTotal? s.fuClosed/s.fuTotal : (s.overdue?0:1);
  parts.follow={pts:Math.round(capped(fuRate)*W.follow), max:W.follow,
    detail:s.fuTotal? s.fuClosed+' of '+s.fuTotal+' closed on time'+(s.overdue?' \u00b7 '+s.overdue+' still overdue':'')
                    : (s.overdue? s.overdue+' overdue from earlier months':'nothing outstanding')};
  parts.service={pts:Math.round(capped(s.checkins/(s.expected||1))*(W.service||0)), max:(W.service||0),
    detail:s.checkins+' raisers asked this month ('+s.expected+' due)'+
      (s.overdueAsk?' \u00b7 '+s.overdueAsk+' overdue for a check-in':'')+
      (s.issuesLogged?' \u00b7 '+s.issuesLogged+' problems logged':'')};
  const total=COMP.reduce((a,[k])=>a+parts[k].pts,0);
  const maxTotal=COMP.reduce((a,[k])=>a+parts[k].max,0);
  const score=pct(total,maxTotal);
  return {adoId, month:m||thisMonth(), stats:s, prevStats:prev, parts, total, score,
    tier:tierOf(score), weakest:COMP.map(([k,l])=>({k,l,gap:parts[k].max-parts[k].pts}))
      .sort((a,b)=>b.gap-a.gap)[0]};
}
function tierOf(score){
  return score>=90?'platinum':score>=75?'gold':score>=60?'silver':score>=45?'bronze':'none';
}
const TIERLBL={platinum:'Platinum',gold:'Gold',silver:'Silver',bronze:'Bronze',none:'Needs coaching'};
function rewardFor(score){
  const t=tierOf(score), r=db.meta.reward||{};
  return {tier:t, amount:num(r[t]||0)};
}
function awardOf(adoId,m){ return db.awards.find(a=>a.adoId===adoId&&a.month===m); }
/* plain-language coaching, worked out from the weakest part of the score */
const ADVICE={
  target:'Volume is the gap. Look at the dormant and declining list first \u2014 winning back an old buyer is faster than finding a new one.',
  newc:'No new names are opening. Work the hot prospects and the barangays with nobody live in them yet.',
  switch:'Rival volume is not moving. Pick the three farms with the biggest competitor bags and run a feeding trial on one stage only \u2014 starter is the easiest to win.',
  coverage:'Whole barangays have no live buyer. Profile them first: who raises, how many heads, what brand. You cannot sell into a barangay you have not mapped.',
  activity:'Call volume is short of the quota. Use the route planner \u2014 it groups the priority list by barangay so the same fuel covers more stops.',
  follow:'Promises are being made and not closed. Every follow-up left open is a customer learning that your word slips.',
  service:'Nobody is being asked what they need. Sit down with the raisers on your list and ask the plain question \u2014 what is hurting the farm right now, and what would help. That is where the next order comes from, and it is what tells the office what to pre-book.'
};
function autoAdvice(sc){
  const w=sc.weakest;
  if(!w||w.gap<=0) return 'Every part of the scorecard is near full. Hold the routine and protect the big accounts.';
  return ADVICE[w.k]||'';
}

let MODAL=null;
function field(f){
  const v=f.val==null?'':f.val;
  let inp; const ev=f.on?` onchange="${f.on}"`:'';
  if(f.type==='select') inp=`<select id="f_${f.k}"${ev}>${f.opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];
      return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`;}).join('')}</select>`;
  else if(f.type==='textarea') inp=`<textarea id="f_${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else if(f.type==='head') return `<div class="sect-head" style="margin:14px 0 6px"><h3>${esc(f.label)}</h3></div>
    ${f.hint?`<div class="small muted" style="margin:-4px 0 8px">${f.hint}</div>`:''}`;
  else if(f.type==='checkbox') inp=`<select id="f_${f.k}"${ev}><option value="yes" ${v?'selected':''}>Yes</option><option value="" ${v?'':'selected'}>No</option></select>`;
  else inp=`<input id="f_${f.k}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"
      ${f.type==='number'?'inputmode="decimal" step="any"':''} ${f.min!=null?'min="'+f.min+'"':''}>`;
  return `<div class="field"><label for="f_${f.k}">${esc(f.label)}</label>${inp}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
}
function modal(title, sub, fields, okLabel, onOk, extraHTML){
  MODAL={fields,onOk};
  $('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">
    <h2>${esc(title)}</h2><div class="sub">${sub||''}</div>
    ${extraHTML||''}
    ${fields.map(field).join('')}
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="submitModal()">${esc(okLabel||'Save')}</button></div></div></div>`;
  const first=$('f_'+fields[0].k); if(first&&window.innerWidth>880) first.focus();
}
function closeModal(){ MODAL=null; $('modalHost').innerHTML=''; }
function submitModal(){
  if(!MODAL) return;
  const o={};
  for(const f of MODAL.fields){
    if(f.type==='head') continue;
    const e=$('f_'+f.k); let v=e?e.value:'';
    if(f.type==='number') v=v===''?'':num(v);
    if(f.type==='checkbox') v=(v==='yes');
    if(f.req&&(v===''||v==null)){ toast('Missing: '+f.label); e&&e.focus(); return; }
    o[f.k]=v;
  }
  const fn=MODAL.onOk; closeModal(); fn(o);
}

function daysLeftInMonth(){
  const t=new Date(), end=new Date(t.getFullYear(),t.getMonth()+1,0);
  return Math.max(0,dDiff(todayISO(),todayISO(end)));

function areaRoll(a,m){
  const ados=adosInArea(a.id);
  const ids=ados.map(u=>u.id);
  const sales=db.sales.filter(s=>ids.includes(s.adoId)&&monthOf(s.date)===m);
  const bagsN=sales.reduce((x,s)=>x+num(s.bags),0);
  const tg=targetFor(m,ids);
  const cust=db.customers.filter(c=>ids.includes(c.adoId));
  const rais=cust.filter(c=>c.isRaiser&&c.status!=='prospect');
  const potential=rais.reduce((x,c)=>x+herdBags(c),0);
  const ours=rais.reduce((x,c)=>x+ourShareOf(c).ours,0);
  return {area:a, sup:supOfArea(a.id), ados:ados.length, bags:bagsN, target:tg.bags,
    ach:pct(bagsN,tg.bags), cust:cust.length, potential:Math.round(potential),
    ours:Math.round(ours), share:pct(ours,potential),
    visits:db.visits.filter(v=>ids.includes(v.adoId)&&monthOf(v.date)===m).length};
}

  if(can('customers')) h+=`<div class="card"><button class="btn danger wide" onclick="delCust('${c.id}')">Delete this customer</button></div>`;

function stageBar(herd){
  const tot=herd.reduce((a,l)=>a+num(l.heads)*rate(l.stage),0);
  if(!tot) return '';
  const used=STAGES.filter(([k])=>herd.some(l=>l.stage===k));
  return `<div class="stagebar">${used.map(([k,,col])=>{
    const v=herd.filter(l=>l.stage===k).reduce((a,l)=>a+num(l.heads)*rate(k),0);
    return `<i style="width:${pct(v,tot)}%;background:${col}"></i>`;}).join('')}</div>
    <div class="legend">${used.map(([k,lbl,col])=>`<span><i style="background:${col}"></i>${lbl}</span>`).join('')}</div>`;
}
function custMoney(c){
  const all=custSales(c.id), t=todayISO();
  const m30=bagsBetween(c.id,addD(t,-30),t), p30=bagsBetween(c.id,addD(t,-60),addD(t,-31));
  const total=all.reduce((a,s)=>a+num(s.bags),0), value=all.reduce((a,s)=>a+num(s.amount),0);
  const trend=p30?Math.round((m30-p30)/p30*100):(m30?100:0);
  return `<div class="sect-head"><h2>What they actually buy from us</h2></div>
  <div class="grid3" style="margin-bottom:11px">
    <div class="stat"><b>${nf(m30)}</b><span>bags, last 30d</span></div>
    <div class="stat"><b style="color:${trend>=0?'var(--good)':'var(--alert)'}">${trend>0?'+':''}${trend}%</b><span>vs 30d before</span></div>
    <div class="stat"><b>${nf(total)}</b><span>bags, all time</span></div></div>
  <div class="card tight small">
    <div class="spread"><span class="muted">Lifetime value</span><b class="money">${peso(value)}</b></div>
    <div class="spread"><span class="muted">Orders</span><b>${all.length}</b></div>
    <div class="spread"><span class="muted">Average order</span><b>${all.length?nf(total/all.length):0} bags</b></div>
    ${c.isRaiser&&herdBags(c)?`<div class="spread"><span class="muted">Share of what they eat</span>
      <b>${pct(m30,herdBags(c))}% of ${nf(herdBags(c))} bags/mo</b></div>`:''}</div>`;
}

    :`<div class="card"><div class="empty">Never visited. That is usually the whole problem.</div></div>`;

/* link a raiser to this store from the store's own page \u2014 far faster than
   opening every raiser one at a time */
function askLinkRaiser(dealerId){
  const d=custOf(dealerId); if(!d) return;
  const ids=areaScopeAdos();
  const bg=brgyOf(d.brgyId)||{};
  const list=db.customers.filter(x=>x.isRaiser&&x.id!==dealerId&&x.buysFrom!==dealerId
      &&(!ids||!x.adoId||ids.includes(x.adoId)))
    .map(x=>{ const b=brgyOf(x.brgyId)||{};
      return {x, rank:(x.brgyId&&x.brgyId===d.brgyId)?0:((b.town&&bg.town&&b.town===bg.town)?1:2),
        label:x.name+' \u2014 '+(b.name||'no barangay')+(x.buysFrom?' (now linked to '+custName(x.buysFrom)+')':'')}; })
    .sort((a,b)=>(a.rank-b.rank)||a.x.name.localeCompare(b.x.name));
  if(!list.length) return toast('No other raisers on file in this area yet.');
  modal('Who sources from '+d.name+'?',
    'Raisers in the same barangay are at the top. Do them one at a time \u2014 it takes three taps each.',
    [{k:'rid',label:'Raiser',type:'select',req:true,val:'',
      opts:[['','\u2014 choose \u2014']].concat(list.map(r=>[r.x.id,r.label]))}],
    'Link them',o=>{
      const r=custOf(o.rid); if(!r) return;
      r.buysFrom=dealerId; save(); toast(r.name+' now sources from '+d.name+'.'); render();
    });
}
function unlinkRaiser(rid){
  const r=custOf(rid); if(!r) return;
  r.buysFrom=''; save(); toast(r.name+' unlinked.'); render();
}
function activateCust(id){
  const c=custOf(id); if(!c) return;
  c.status='active'; c.since=c.since||todayISO(); save(); toast(c.name+' is now a live customer.'); render();
}
function delCust(id){
  const c=custOf(id); if(!c) return;
  confirmBox('Delete '+c.name+'? Their orders and visits stay in the records but will show no name.',()=>{
    db.customers=db.customers.filter(x=>x.id!==id); db.tombs.push(id);
    save(); toast('Deleted.'); go('cust');
  });
}

function herdRow(l,i,brands){
  return `<div class="herdline" data-i="${i}">
    <select class="hs">${STAGES.map(([k,lbl])=>`<option value="${k}" ${l&&l.stage===k?'selected':''}>${lbl}</option>`).join('')}</select>
    <input class="hh" type="number" inputmode="numeric" min="0" placeholder="head" value="${l&&l.heads!==''&&l.heads!=null?esc(l.heads):''}">
    <input class="hb" list="brandlist" placeholder="brand" value="${l?esc(l.brand||ourBrand()):esc(ourBrand())}">
    <button onclick="dropHerdRow(this)" title="remove">\u00d7</button>
  </div>`;
}
function addHerdRow(){
  const box=$('herdRows'); if(!box) return;
  const e=$('herdEmpty'); if(e) e.remove();
  const d=document.createElement('div');
  d.innerHTML=herdRow(null,box.children.length,knownBrands());
  box.appendChild(d.firstElementChild);
  grabHerdDraft();
  const last=box.lastElementChild.querySelector('.hh'); if(last) last.focus();
}
function dropHerdRow(btn){
  const box=$('herdRows');
  btn.parentNode.remove();
  grabHerdDraft();
  if(box&&!box.children.length) box.innerHTML='<div class="empty" id="herdEmpty">No lines yet. Add one for every stage on the farm.</div>';

function cancelHerd(id){ HERDDRAFT=null; go('customer',id); }
function saveHerd(id){
  const c=custOf(id); if(!c) return;
  const rows=[...document.querySelectorAll('#herdRows .herdline')];
  const all=rows.map(r=>({stage:r.querySelector('.hs').value,
    heads:num(r.querySelector('.hh').value),
    brand:(r.querySelector('.hb').value||ourBrand()).trim()}));
  const herd=all.filter(l=>l.heads>0);
  const dropped=all.length-herd.length;
  /* a line with no head count used to vanish without a word \u2014 say so instead */
  if(dropped&&!herd.length){
    grabHerdDraft();
    return toast(all.length===1?'Put the number of head on the line before saving.'
      :'Every line needs a number of head. Nothing was saved.');
  }
  if(dropped) toast(dropped+' line'+(dropped===1?'':'s')+' had no head count and '+(dropped===1?'was':'were')+' left out.');
  c.herd=herd; c.herdAt=todayISO(); c.herdBy=who();
  if(c.isRaiser&&!c.isDealer&&!c.ftype) c.ftype='Backyard';
  HERDDRAFT=null;
  save();
  setTimeout(()=>toast('Herd profile saved \u2014 '+nf(herdBags(c))+' bags a month.'),dropped?1200:0);
  go('customer',id);
}

/* Stages you can sell, plus the things that are not hog feed at all \u2014 chick
   booster, a sack of salt \u2014 which have no stage and often no brand either. */
const SALEKINDS=STAGES.map(([k,l])=>[k,l]).concat([['other','Other / not hog feed']]);
const SALEKINDMAP=Object.fromEntries(SALEKINDS);
function saleStage(x){ return SALEKINDMAP[x.stage] || (STAGEMAP[x.stage]||{}).label || x.product || '\u2014'; }
/* one transaction = several rows sharing an order id */
function orderIdOf(x){ return x.orderId||x.id; }
function orderRows(oid){ return db.sales.filter(x=>orderIdOf(x)===oid).sort((a,b)=>(a.seq||0)-(b.seq||0)); }
function groupOrders(list){
  const m=new Map();
  list.forEach(x=>{ const k=orderIdOf(x); if(!m.has(k)) m.set(k,[]); m.get(k).push(x); });
  return [...m.entries()].map(([id,rows])=>({id,rows,
    date:rows[0].date, custId:rows[0].custId, adoId:rows[0].adoId, by:rows[0].by,
    bags:rows.reduce((a,x)=>a+num(x.bags),0),
    amount:rows.reduce((a,x)=>a+num(x.amount),0)}));
}
function saleBrand(x){ return (x.brand===undefined||x.brand===null)? ourBrand() : x.brand; }
function saleBrandLabel(x){ return saleBrand(x)||'No brand'; }
/* The order screen. A single visit can leave with grower on one brand, starter
   on another, and a sack of chick feed with no brand at all \u2014 so an order is a
   list of lines, not one box. */
let SALEPRE=null, SALEDRAFT=null;
function askSale(custId,orderId){
  SALEPRE={custId:custId||'', orderId:orderId||''};
  SALEDRAFT=null;
  go('sale', orderId||'new');
}
function grabSaleDraft(){
  const box=document.getElementById('saleRows'); if(!box) return;
  SALEDRAFT={key:SUB, rows:[...box.querySelectorAll('.saleline')].map(r=>({
      stage:r.querySelector('.ss').value, bags:r.querySelector('.sb').value,
      amount:r.querySelector('.sa').value, brand:r.querySelector('.sbr').value})),
    date:($('sale_date')||{}).value, custId:($('sale_cust')||{}).value,
    adoId:($('sale_ado')||{}).value, note:($('sale_note')||{}).value};
}
function saleRowHTML(l,brands){
  const b=l||{};
  return `<div class="saleline">
    <select class="ss" onchange="salePrice(this)">${SALEKINDS.map(([k,lab])=>
      `<option value="${k}" ${b.stage===k?'selected':''}>${lab}</option>`).join('')}</select>
    <input class="sb" type="number" inputmode="decimal" min="0" placeholder="bags"
      value="${b.bags!=null&&b.bags!==''?esc(b.bags):''}" oninput="salePrice(this)">
    <input class="sa" type="number" inputmode="decimal" min="0" placeholder="amount"
      value="${b.amount!=null&&b.amount!==''?esc(b.amount):''}" oninput="saleTotal()">
    <input class="sbr" list="brandlist" placeholder="brand (blank if none)"
      value="${b.brand!=null?esc(b.brand):esc(ourBrand())}" onchange="salePrice(this)">
    <button class="sx" onclick="dropSaleRow(this)" title="remove">\u00d7</button>
  </div>`;
}
function vSaleEntry(){
  const key=SUB||'new';

  const pre=SALEPRE||{};
  const first=existing[0]||{};
  const rows=draft?draft.rows
    :(existing.length?existing.map(x=>({stage:x.stage||'grower',bags:x.bags,amount:x.amount,brand:x.brand==null?ourBrand():x.brand}))
                     :[{stage:'grower',bags:'',amount:'',brand:ourBrand()}]);

  const cust=(draft&&draft.custId)||first.custId||pre.custId||'';
  const ado=(draft&&draft.adoId)||first.adoId||'';
  const note=(draft&&draft.note)||first.note||'';
  const brands=knownBrands();
  const custs=scopedCustomers().slice().sort((a,b)=>a.name.localeCompare(b.name));
  const pool=(role()==='ado')?[]:(isSup()?adosInArea(myArea()):(AREAF==='all'?adosAll():adosInArea(AREAF)));

  let h=`<button class="backlink" onclick="SALEDRAFT=null;${back}">\u2039 Back</button>`;
  h+=pageHead(editing?'Edit the order':'Record a sale',
    'One line for each thing they bought. The price fills itself in from the book.');
  h+=`<datalist id="brandlist">${brands.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>`;
  h+=`<div class="card">
    <div class="field"><label for="sale_date">Date</label>
      <input id="sale_date" type="date" value="${esc(date)}"></div>
    <div class="field"><label for="sale_cust">Customer</label>
      <select id="sale_cust"><option value="">\u2014 choose \u2014</option>
      ${custs.map(c=>`<option value="${c.id}" ${cust===c.id?'selected':''}>${esc(c.name)} (${custType(c)})</option>`).join('')}
      </select></div>
    ${pool.length?`<div class="field"><label for="sale_ado">Assigned ADO</label>
      <select id="sale_ado"><option value="">\u2014 unassigned \u2014</option>
      ${pool.map(u=>`<option value="${u.id}" ${ado===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}
      </select></div>`:''}
  </div>`;
  h+=`<div class="sect-head"><h2>What they bought</h2></div>
    <div class="salehead"><span>Stage</span><span>Bags</span><span>Amount</span><span>Brand</span><span></span></div>
    <div id="saleRows">${rows.map(l=>saleRowHTML(l,brands)).join('')}</div>
    <button class="btn ghost wide" onclick="addSaleRow()">+ Add a line</button>
    <div class="saletotal" id="saleTotal"><span>Total</span><b>\u2014</b></div>
    <div class="hint" style="margin:7px 2px 12px">Leave the brand blank for anything that is not feed, or for feed with
    no brand \u2014 chick booster, salt, a sack of bran. Those still count in the peso total but never touch the hog
    market numbers.</div>`;

    <input id="sale_note" value="${esc(note)}" placeholder="delivery, terms, who picked it up\u2026"></div>

    <button class="btn" onclick="saveSale()">${editing?'Save the changes':'Save the order'}</button></div>
    ${editing?`<button class="btn danger wide" style="margin-top:9px" onclick="delOrder('${key}')">Delete this whole order</button>`:''}
  </div>`;
  setTimeout(saleTotal,20);
  return h;
}
function addSaleRow(){
  const box=$('saleRows'); if(!box) return;
  const d=document.createElement('div');
  d.innerHTML=saleRowHTML({stage:'grower',bags:'',amount:'',brand:ourBrand()},knownBrands());
  box.appendChild(d.firstElementChild);
  grabSaleDraft(); saleTotal();
  const last=box.lastElementChild.querySelector('.sb'); if(last) last.focus();
}
function dropSaleRow(btn){
  const box=$('saleRows');
  if(box&&box.children.length<=1) return toast('An order needs at least one line.');
  btn.parentNode.remove(); grabSaleDraft(); saleTotal();
}
/* fill the amount from the price book the moment the stage, bags or brand settle */
function salePrice(el){
  const row=el.closest('.saleline'); if(!row) return;
  const stage=row.querySelector('.ss').value;
  const brand=row.querySelector('.sbr').value.trim();
  const bags=num(row.querySelector('.sb').value);
  const amt=row.querySelector('.sa');
  const unit=brand?(brandPrice(brand,stage)||0):0;
  if(bags&&unit){
    if(!amt.value||amt.dataset.auto==='1'){ amt.value=Math.round(bags*unit); amt.dataset.auto='1'; }
    amt.placeholder=Math.round(bags*unit);
  } else if(bags&&!unit) amt.placeholder='type it';
  grabSaleDraft(); saleTotal();
}
function saleTotal(){
  const box=$('saleRows'), out=$('saleTotal'); if(!box||!out) return;
  let bags=0, amt=0, lines=0;
  [...box.querySelectorAll('.saleline')].forEach(r=>{
    const b=num(r.querySelector('.sb').value), a=num(r.querySelector('.sa').value);
    if(b||a) lines++;
    bags+=b; amt+=a;
  });
  out.innerHTML=`<span>Total \u00b7 ${lines} line${lines===1?'':'s'} \u00b7 ${nf(bags)} bags</span><b>${peso(amt)}</b>`;
}
function saveSale(){
  const box=$('saleRows'); if(!box) return;
  const date=($('sale_date')||{}).value||todayISO();
  const custId=($('sale_cust')||{}).value||'';
  if(!custId){ grabSaleDraft(); return toast('Choose the customer first.'); }
  const adoEl=$('sale_ado');
  let adoId=adoEl?adoEl.value:'';
  if(role()==='ado') adoId=SESSION.id;
  adoId=adoId||(custOf(custId)||{}).adoId||'';
  const note=($('sale_note')||{}).value||'';
  const raw=[...box.querySelectorAll('.saleline')].map(r=>({
    stage:r.querySelector('.ss').value,
    bags:num(r.querySelector('.sb').value),
    amount:r.querySelector('.sa').value,
    brand:r.querySelector('.sbr').value.trim()}));
  const lines=raw.filter(l=>l.bags>0||num(l.amount)>0);
  if(!lines.length){ grabSaleDraft(); return toast('Put bags or an amount on at least one line.'); }
  const oid=(SUB&&SUB!=='new')?SUB:uid('or');
  db.sales=db.sales.filter(x=>orderIdOf(x)!==oid);
  lines.forEach((l,i)=>{
    const unit=l.brand?(brandPrice(l.brand,l.stage)||0):0;
    const amount=(l.amount===''||l.amount==null)? num(l.bags)*unit : num(l.amount);
    db.sales.push({id:uid('sa'), orderId:oid, seq:i, date, custId, adoId,
      stage:l.stage, brand:l.brand, bags:num(l.bags), amount,
      unitPrice:num(l.bags)?amount/num(l.bags):unit,
      note, by:who(), at:new Date().toISOString()});
  });
  const c=custOf(custId); if(c&&c.status==='prospect'){ c.status='active'; c.since=c.since||date; }
  SALEDRAFT=null;
  const tot=lines.reduce((a,l)=>a+num(l.bags),0);
  save(); toast('Order saved \u2014 '+lines.length+' line'+(lines.length===1?'':'s')+', '+nf(tot)+' bags.');
  go('customer',custId);
}
function delOrder(oid){
  confirmBox('Delete the whole order? Every line on it goes.',()=>{
    const rows=orderRows(oid); const cid=rows[0]?rows[0].custId:'';
    rows.forEach(r=>db.tombs.push(r.id));
    db.sales=db.sales.filter(x=>orderIdOf(x)!==oid);
    SALEDRAFT=null; save(); toast('Order deleted.');
    cid?go('customer',cid):go('sales');
  });
}

        <div class="body"><div class="t">${esc(custName(s.custId))}</div><div class="d">${esc(s.why||'')}</div></div>
        <button class="btn ${s.done?'ghost':''} sm" onclick="tickStop('${today.id}',${i})">${s.done?'Undo':'Done'}</button>
      </div>`).join('')}</div>`;
    });
    h+=`<div class="grid2"><button class="btn ghost" onclick="buildRoute()">Rebuild</button>
      <button class="btn ghost" onclick="delRec('routes','${today.id}')">Clear the route</button></div>`;
  }
  const past=mine.filter(r=>r.date!==t).slice(0,10);
  if(past.length) h+=`<div class="sect-head"><h2>Past routes</h2></div><div class="card tight">
    ${past.map(r=>`<div class="spread small" style="padding:6px 0"><span>${fdate(r.date)}</span>
      <span class="muted">${(r.stops||[]).filter(s=>s.done).length}/${(r.stops||[]).length} done</span></div>`).join('')}</div>`;
  return h;
}
function buildRoute(){
  const t=todayISO(), pv=priorityVisits(12);
  if(!pv.length) return toast('Nothing to route \u2014 everybody is covered.');
  const byB={};
  pv.forEach(p=>{const c=custOf(p.custId); const b=c?(c.brgyId||'zz'):'zz'; (byB[b]=byB[b]||[]).push(p);});
  const stops=[];
  Object.values(byB).forEach(arr=>arr.forEach(p=>stops.push({custId:p.custId,why:p.why,done:false})));
  db.routes=db.routes.filter(r=>!(r.date===t&&inScope(r)));
  db.routes.push({id:uid('rt'),date:t,adoId:role()==='ado'?SESSION.id:(ADOF!=='all'?ADOF:''),stops,by:who()});
  save(); toast(stops.length+' stops planned.'); go('route');
}
function tickStop(rid,i){
  const r=db.routes.find(x=>x.id===rid); if(!r||!r.stops[i]) return;
  r.stops[i].done=!r.stops[i].done; save(); render();
}

function brgyStats(b){
  const cust=db.customers.filter(c=>c.brgyId===b.id);
  const rais=cust.filter(c=>c.isRaiser&&c.status!=='prospect');
  const potential=rais.reduce((a,c)=>a+herdBags(c),0);
  const ours=rais.reduce((a,c)=>a+ourShareOf(c).ours,0);
  const m=thisMonth();
  const sold=db.sales.filter(s=>{const c=custOf(s.custId);return c&&c.brgyId===b.id&&monthOf(s.date)===m;})
    .reduce((a,s)=>a+num(s.bags),0);
  return {cust:cust.length, rais:rais.length, active:cust.filter(isActive).length,
    comp:cust.filter(onCompetitor).length, dealers:cust.filter(c=>c.isDealer).length,
    heads:rais.reduce((a,c)=>a+headCount(c),0),
    potential:Math.round(potential), ours:Math.round(ours), share:pct(ours,potential), sold};
}

      (byBrand[b]=byBrand[b]||{bags:0,value:0,list:[]});
      byBrand[b].bags+=num(l.heads)*rate(l.stage);
      byBrand[b].value+=num(l.heads)*rate(l.stage)*ourPrice(l.stage);
      if(!byBrand[b].list.includes(c)) byBrand[b].list.push(c); });
    if(c.isDealer) splitBrands(c.brands).filter(s=>!isOurs(s))
      .forEach(b=>{ (byBrand[b]=byBrand[b]||{bags:0,value:0,list:[]}); if(!byBrand[b].list.includes(c)) byBrand[b].list.push(c); });
  });
  const brands=Object.entries(byBrand).sort((a,b)=>b[1].bags-a[1].bags);
  let h=backTo('market','Market')+pageHead('Competitors','Who you are losing volume to, by how much, and where.',

        ${rec&&rec.weak?`<div class="small" style="margin-top:6px"><b>Their weak point:</b> ${esc(rec.weak)}</div>`:''}
        <div class="bar"><i class="r" style="width:${pct(v.bags,lost)}%"></i></div>
        <div class="row wrap" style="margin-top:8px">
          ${v.list.slice(0,6).map(c=>`<button class="btn ghost sm" onclick="go('customer','${c.id}')">${esc(c.name)}</button>`).join('')}
          ${v.list.length>6?`<span class="tiny muted">+${v.list.length-6} more</span>`:''}</div>
        ${can('market')?`<button class="btn ghost sm wide" style="margin-top:8px"
          onclick="askComp('${rec?rec.id:''}','${esc(b)}')">${rec?'Edit brand notes':'Add price and notes'}</button>`:''}
      </div>`;}).join('');
  }
  if(db.competitors.length) h+=`<div class="sect-head"><h2>Price book</h2><span class="count">\u20B1 a bag</span></div>

      const t=brandPrice(c.brand,k), o=ourPrice(k);

    .concat([
     {k:'strength',label:'Their strong point',val:c?c.strength:'',ph:'e.g. long credit terms'},
     {k:'weak',label:'Where they are weak',val:c?c.weak:'',ph:'e.g. slow delivery, poor conversion'},
     {k:'note',label:'Notes',type:'textarea',val:c?c.note:''}
  ]),'Save',o=>{
    const prices={}; let any=0, sum=0;
    STAGES.forEach(([k])=>{ const v=o['p_'+k];
      if(v!==''&&v!=null){ prices[k]=num(v); if(num(v)){ any++; sum+=num(v); } } });
    const rec={brand:o.brand,company:o.company,prices,
      price:any?Math.round(sum/any):0,   /* kept as the rough average */
      strength:o.strength,weak:o.weak,note:o.note};

/* where we are cheaper, stage by stage */
function priceGaps(comp){
  if(!comp||!comp.brand) return [];
  return STAGES.map(([k,l])=>{
    const theirs=brandPrice(comp.brand,k), ours=ourPrice(k);
    if(!theirs||!ours) return null;
    return {stage:k,label:l,ours,theirs,diff:theirs-ours};
  }).filter(Boolean);
}
function priceTable(comp){
  const gaps=priceGaps(comp);
  if(!gaps.length) return `<div class="small muted" style="margin-top:7px">No prices on file for this brand yet.</div>`;
  const best=gaps.slice().sort((a,b)=>b.diff-a.diff)[0];
  return `<div class="scrollx" style="margin-top:9px"><table class="matrix">
    <thead><tr><th>Stage</th><th>Ours</th><th>${esc(comp.brand)}</th><th>Gap</th></tr></thead><tbody>
    ${gaps.map(g=>`<tr><td>${g.label}</td><td>${peso(g.ours)}</td><td>${peso(g.theirs)}</td>
      <td style="color:${g.diff>0?'var(--good)':g.diff<0?'var(--alert)':'var(--muted)'}">${g.diff>0?'+':''}${peso(g.diff)}</td></tr>`).join('')}
    </tbody></table></div>
    ${best&&best.diff>0?`<div class="small" style="margin-top:7px"><b>Cheapest way in: ${best.label.toLowerCase()}.</b>
      <span class="muted">We are ${peso(best.diff)} a bag under them there. Ask for that one stage first, not the whole farm.</span></div>`
     :`<div class="small muted" style="margin-top:7px">They are at or under us on every stage on file.
      Lead with feed conversion and service, not price.</div>`}`;
}

function proposeAward(adoId,m){
  const sc=scorecard(adoId,m), rw=rewardFor(sc.score);
  const over=Math.max(0,sc.stats.bags-sc.stats.target)*num(db.meta.bonusPerExtraBag);
  if(!rw.amount&&!over) return toast('This score does not reach a reward tier yet.');
  modal('Propose a reward for '+adoName(adoId),
    'Score '+sc.score+' \u00b7 '+TIERLBL[sc.tier]+'. The manager approves before anything is released.',[
    {k:'amount',label:'Amount (\u20B1)',type:'number',req:true,val:Math.round(rw.amount+over),min:0,
      hint:over?'Tier '+peso(rw.amount)+' plus '+peso(over)+' for bags over target.':''},
    {k:'note',label:'Why',type:'textarea',val:'Score '+sc.score+' ('+TIERLBL[sc.tier]+'): '+
      nf(sc.stats.bags)+' of '+nf(sc.stats.target)+' bags, '+sc.stats.newC+' new customers, '+
      sc.stats.visits+' visits, coverage '+sc.stats.coverage+'%.'}
  ],'Propose',o=>{
    const ex=awardOf(adoId,m);

      <div><b>${esc(adoName(sc.adoId))}</b> <span class="medal ${sc.tier}">${TIERLBL[sc.tier]}</span>
        <div class="small muted">Score ${sc.score} \u00b7 ${nf(sc.stats.bags)} of ${nf(sc.stats.target)} bags</div></div>

        ${!aw&&can('propose')?`<button class="btn sm" onclick="proposeAward('${sc.adoId}','${m}')">Propose</button>`:''}
        ${aw&&aw.status==='proposed'&&isManager()?`<button class="btn sm" onclick="approveAward('${aw.id}')">Approve</button>
          <button class="btn danger sm" onclick="rejectAward('${aw.id}')">Send back</button>`:''}
        ${aw&&aw.status==='approved'&&isManager()?`<button class="btn sm" onclick="releaseAward('${aw.id}')">Release</button>`:''}
        ${aw&&aw.status==='returned'&&can('propose')?`<button class="btn sm" onclick="proposeAward('${sc.adoId}','${m}')">Revise</button>`:''}
      </div></div>`;}).join('');
  const hist=mine.filter(a=>a.month!==m).sort((a,b)=>b.month.localeCompare(a.month)).slice(0,12);
  if(hist.length) h+=`<div class="sect-head"><h2>Earlier</h2></div><div class="card tight scrollx">

    </table></div>`;

/* ---- activity trail: the "agi" of each ADO ---- */
function vActivity(){
  const adoId=SUB||(ADOF!=='all'?ADOF:null);
  let pool=isSup()?adosInArea(myArea()):(AREAF==='all'?adosAll():adosInArea(AREAF));
  let h=backTo('team','Team')+pageHead('Activity trail','Everything each ADO has entered, newest first.');
  h+=scopePicker();
  const ids=adoId?[adoId]:pool.map(u=>u.id);
  const ev=[];
  db.sales.filter(s=>ids.includes(s.adoId)).forEach(s=>ev.push({at:s.at||s.date,d:s.date,adoId:s.adoId,
    t:'Order',x:custName(s.custId)+' \u00b7 '+nf(s.bags)+' bags'}));
  db.visits.filter(v=>ids.includes(v.adoId)).forEach(v=>ev.push({at:v.at||v.date,d:v.date,adoId:v.adoId,
    t:'Visit',x:custName(v.custId)+' \u00b7 '+(OUTCOME[v.outcome]||'')}));
  db.customers.filter(c=>ids.includes(c.adoId)).forEach(c=>{
    ev.push({at:c.added,d:c.added,adoId:c.adoId,t:'Mapped',x:c.name+' ('+custType(c)+')'});
    if(c.herdAt) ev.push({at:c.herdAt,d:c.herdAt,adoId:c.adoId,t:'Herd profiled',
      x:c.name+' \u00b7 '+nf(headCount(c))+' heads, '+nf(herdBags(c))+' bags/mo'});});
  db.followups.filter(f=>ids.includes(f.adoId)&&f.status==='done').forEach(f=>ev.push({at:f.doneAt||f.due,
    d:todayISO(f.doneAt||f.due),adoId:f.adoId,t:'Follow-up closed',x:custName(f.custId)+' \u00b7 '+f.what}));
  db.opps.filter(o=>ids.includes(o.adoId)&&o.stage==='won').forEach(o=>ev.push({at:o.close,d:o.close,
    adoId:o.adoId,t:'Switch won',x:custName(o.custId)+' \u00b7 '+nf(o.bags)+' bags/mo'}));
  db.issues.filter(i=>ids.includes(i.adoId)).forEach(i=>{
    ev.push({at:i.at||i.date,d:i.date,adoId:i.adoId,t:'Problem logged',
      x:custName(i.custId)+' \u00b7 '+(ISSUECAT[i.cat]||i.cat)+(i.needKind?' \u2192 needs '+(NEEDKIND[i.needKind]||'').toLowerCase():'')});
    if(i.resolvedAt) ev.push({at:i.resolvedAt,d:todayISO(i.resolvedAt),adoId:i.adoId,t:'Problem resolved',
      x:custName(i.custId)+' \u00b7 '+(ISSUECAT[i.cat]||i.cat)});});
  ev.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
  if(!ev.length) return h+emptyBox('Nothing recorded yet','The trail fills itself as the team works.');
  const byDay={};
  ev.slice(0,150).forEach(e=>{ (byDay[e.d]=byDay[e.d]||[]).push(e); });
  Object.entries(byDay).forEach(([d,list])=>{
    h+=`<div class="sect-head"><h2>${fdate(d)}</h2><span class="count">${list.length}</span></div><div class="card tight">
      ${list.map(e=>`<div class="spread small" style="padding:6px 0;border-bottom:1px solid var(--line-soft)">
        <span><b>${esc(e.t)}</b> \u00b7 ${esc(e.x)}</span>
        <span class="muted tiny">${esc(adoName(e.adoId).split(' ')[0])}</span></div>`).join('')}</div>`;
  });
  return h;
}

  </div>`;
  /* the three kinds, side by side \u2014 one record can be a dealer, a raiser, or both,
     so this is the only place the difference is spelled out in full */
  const KIND=[
    ['\u{1F3EA} Store dealers only', c=>c.isDealer&&!c.isRaiser&&c.status!=='prospect'],
    ['\u{1F416} Hog raisers only',   c=>c.isRaiser&&!c.isDealer&&c.status!=='prospect'],
    ['\u{1F3EA}\u{1F416} Dealer + raiser', c=>c.isDealer&&c.isRaiser&&c.status!=='prospect'],

    </tbody></table>

    <b>Through them</b> is what passes over their counter to other raisers. A dealer who also raises shows a figure
    in both columns, and the two are never added together \u2014 that is how double counting is avoided.</div></div>`;
  /* supply links: how much of the map is still guesswork */
  const rais=scopedCustomers().filter(c=>c.isRaiser&&c.status!=='prospect');

  h+=`<div class="card"><div class="spread"><div><b class="small">Supply links mapped</b>

function askUser(id){

    {k:'name',label:'Full name',req:true,val:u?u.name:''},
    {k:'username',label:'Username',req:true,val:u?(u.username||''):'',hint:'Short, no spaces.'},
    {k:'role',label:'Role',type:'select',req:true,val:u?u.role:'ado',
      opts:Object.entries(ROLE).map(([k,r])=>[k,r.label])},
    {k:'areaId',label:'Area',type:'select',val:u?u.areaId:'',
      opts:[['','\u2014 none \u2014']].concat(db.areas.map(a=>[a.id,a.name])),
      hint:'Supervisors and ADOs must have an area, or their work rolls up to nobody.'},
    {k:'pin',label:u?'New password (blank keeps the old one)':'Password (at least 4 characters)',type:'password',val:''},
    {k:'active',label:'Can sign in',type:'select',val:u?(u.active===false?'no':'yes'):'yes',

  ],'Save',o=>{
    const un=String(o.username).trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
    if(!un) return toast('Letters, numbers, dot, dash or underscore only.');
    if(u){
      if(u.id===SESSION.id&&o.role!=='manager') return toast('You cannot remove your own manager role.');
      if(u.id===SESSION.id&&o.active==='no') return toast('You cannot switch off your own account.');
      if(db.users.some(x=>x.id!==u.id&&(x.username||'').toLowerCase()===un)) return toast('That username is taken.');
      u.name=o.name; u.username=un; u.role=o.role; u.areaId=o.areaId; u.active=o.active!=='no';
      if(o.pin){ if(o.pin.length<4) return toast('At least 4 characters.'); u.pin=pinHash(o.pin,u.id); }
      if(u.id===SESSION.id){ SESSION.name=u.name; SESSION.role=u.role; db.meta.encoder=u.name; }
    } else {
      if(!o.pin||o.pin.length<4) return toast('Give them a password of at least 4 characters.');
      if(db.users.some(x=>(x.username||'').toLowerCase()===un)) return toast('That username is taken.');
      const nid=uid('u');
      db.users.push({id:nid,name:o.name,username:un,role:o.role,areaId:o.areaId,

    <b class="small">Remove this account</b>

function delUser(id){
  const u=userOf(id); if(!u) return;

  const mgrs=db.users.filter(x=>x.role==='manager'&&x.active!==false&&x.id!==id);
  if(u.role==='manager'&&!mgrs.length) return toast('This is the only manager left. Make another one first.');
  confirmBox('Delete the sign-in for '+u.name+'? Their records are not touched.',()=>{
    db.users=db.users.filter(x=>x.id!==id); db.tombs.push(id);
    db.areas.forEach(a=>{ if(a.supervisorId===id) a.supervisorId=''; });
    save(); toast(u.name+' removed.'); render();

}
