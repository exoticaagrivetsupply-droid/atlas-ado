function dl(name,text,type){
  const b=new Blob([text],{type:type||'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},900);
}
function exportJSON(){ dl('atlas-backup-'+todayISO()+'.json', JSON.stringify(db,null,1)); toast('Backup downloaded.'); }
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.meta) throw 0;
      confirmBox('Replace all data on this device?',()=>{ db=Object.assign(blank(),d); save(); go('dash'); toast('Imported.'); });
    }catch(e){ toast('That file could not be read.'); } };
  r.readAsText(f);
}

    r.push([m,u.name,areaName(u.areaId),sc.score,TIERLBL[sc.tier]]
      .concat(COMP.map(([k])=>sc.parts[k].pts))
      .concat([s.bags,s.target,s.ach,s.visits,s.newC,s.coverage,s.switchBags]));});
  dl('atlas-scorecards-'+m+'.csv',csv(r),'text/csv');
}
function wipe(){ confirmBox('This erases ALL records. There is no undo. Do you have a backup?',()=>{

/* ============================================================
   PROBLEMS AND NEEDS
   The ADO is the company's eyes on the farm. Every visit asks the
   plain question: what is hurting you, and what would help? The
   answers pile up into a demand board the supervisor and manager
   can pre-book against, long before anybody runs out.
   ============================================================ */
const ISSUECAT={
  mortality:'Deaths / high mortality',
  scour:'Scouring / diarrhoea',
  growth:'Slow growth / poor conversion',
  repeat:'Repeat breeding / sow not settling',
  farrow:'Small litters / weak piglets',
  respi:'Coughing / respiratory',
  skin:'Mange / skin problems',
  asf:'ASF scare / biosecurity',
  heat:'Heat stress / water supply',
  housing:'Housing or pen problems',
  feedq:'Feed quality complaint',
  supply:'Cannot get stock \u2014 dealer runs out',
  price:'Price too high / needs credit',
  buyer:'No buyer / hog price too low',
  capital:'Short of capital',
  know:'Does not know how \u2014 needs training',
  other:'Something else'
};
const NEEDKIND={
  vet:'Vet or technician visit',
  med:'Medicine and vitamins',
  vaccine:'Vaccine',
  dewormer:'Dewormer',
  feedplan:'Feeding programme',
  samples:'Trial or sample bags',
  training:'Training / seminar',
  biosec:'Biosecurity supplies (disinfectant, lime)',
  credit:'Credit terms',
  delivery:'Delivery or hauling',
  stock:'Breeding stock or semen',
  equip:'Equipment (feeder, drinker, heater)',
  buyer:'Help finding a buyer',
  other:'Something else'
};
const ISTATUS={open:['Open','r'],booked:['Booked','w'],resolved:['Sorted out','g']};
const SEVLBL={high:['Urgent','r'],med:['Needs attention','w'],low:['Minor','n']};
function issuesOf(cid){ return db.issues.filter(i=>i.custId===cid).sort((a,b)=>b.date.localeCompare(a.date)); }
function openIssues(){ return db.issues.filter(i=>inScope(i)&&i.status!=='resolved'); }
function openNeeds(){ return openIssues().filter(i=>i.needKind); }
function needLabel(i){ return (NEEDKIND[i.needKind]||i.needKind||''); }
function askGap(){ return num(db.meta.askGapDays)||60; }
function dueForAsk(c){ return c.isRaiser&&c.status!=='prospect'&&(!c.askedAt||daysSince(c.askedAt)>askGap()); }

/* ---- on the customer page ---- */
function custIssues(c){
  const list=issuesOf(c.id);
  const open=list.filter(i=>i.status!=='resolved');
  const overdue=dueForAsk(c);
  let h=`<div class="sect-head"><h2>\u{1F6A7} Problems and needs</h2>
    ${can('issues')?`<span class="count"><button class="link" onclick="askIssue('${c.id}')">Log one</button></span>`:''}</div>`;
  if(c.isRaiser&&c.status!=='prospect'){
    h+=`<div class="card tight ${overdue?'':''}" style="${overdue?'border-color:#EEDCAF;background:#FFFDF5':''}">
      <div class="spread"><div><b class="small">${c.askedAt?'Last asked what they need':'Never asked what they need'}</b>
        <div class="tiny muted">${c.askedAt?fdate(c.askedAt)+' \u00b7 '+daysSince(c.askedAt)+' days ago'
          :'The question has never been put to them.'} \u00b7 every ${askGap()} days is the standard</div></div>
      ${can('issues')?`<button class="btn ${overdue?'':'ghost'} sm" onclick="logCheckin('${c.id}')">Ask now</button>`:''}</div></div>`;
  }
  if(!list.length) return h+`<div class="card"><div class="empty">Nothing recorded.
    Ask them plainly \u2014 what is hurting the farm, and what would help.</div></div>`;
  h+=open.map(issueCard).join('');
  const closed=list.filter(i=>i.status==='resolved');
  if(closed.length) h+=`<div class="card tight"><b class="small">Sorted out (${closed.length})</b>
    ${closed.slice(0,6).map(i=>`<div class="spread small" style="padding:5px 0">
      <span>${esc(ISSUECAT[i.cat]||i.cat)}</span>
      <span class="muted tiny">${fshort(i.date)} \u2192 ${fshort(i.resolvedAt)}</span></div>`).join('')}</div>`;
  return h;
}
function issueCard(i,showName){
  const sev=SEVLBL[i.severity]||SEVLBL.low, st=ISTATUS[i.status]||ISTATUS.open;
  const late=i.needBy&&i.needBy<todayISO()&&i.status!=='resolved';
  return `<div class="card ${i.severity==='high'?'':''}" ${i.severity==='high'?'style="border-color:#EFC7C1"':''}>
    <div class="spread"><div style="flex:1;min-width:0">
      ${showName?`<b>${esc(custName(i.custId))}</b><div class="tiny muted">${esc(brgyName((custOf(i.custId)||{}).brgyId))}
        ${isBoss()&&i.adoId?' \u00b7 '+esc(adoName(i.adoId).split(' ')[0]):''}</div>`:''}
      <div style="margin:${showName?'5px':'0'} 0 3px"><span class="pill ${sev[1]}">${sev[0]}</span>
        <span class="pill ${st[1]}">${st[0]}</span></div>
      <b class="small">${esc(ISSUECAT[i.cat]||i.cat)}</b>
      ${i.detail?`<div class="small muted" style="margin-top:3px">${esc(i.detail)}</div>`:''}
    </div></div>
    ${i.needKind?`<div class="note" style="margin:9px 0 0">
      <div class="who">What would help</div>
      <div style="margin-top:3px">${esc(needLabel(i))}${i.needQty?' \u00b7 '+esc(i.needQty)+' '+esc(i.needUnit||''):''}
        ${i.needBy?` \u00b7 needed by <b${late?' style="color:var(--alert)"':''}>${fshort(i.needBy)}${late?' (late)':''}</b>`:''}</div>
      ${i.bookedWith?`<div class="small" style="margin-top:5px"><b>Booked with:</b> ${esc(i.bookedWith)}
        ${i.bookedAt?' \u00b7 '+fshort(i.bookedAt):''}</div>`:''}</div>`:''}
    <div class="row wrap" style="margin-top:9px">
      ${showName?`<button class="btn ghost sm" onclick="go('customer','${i.custId}')">Open farm</button>`:''}
      ${can('issues')?`<button class="btn ghost sm" onclick="askIssue(null,'${i.id}')">Edit</button>`:''}
      ${i.needKind&&i.status==='open'&&can('demand')?`<button class="btn sm" onclick="bookNeed('${i.id}')">Mark booked</button>`:''}
      ${i.status!=='resolved'&&can('issues')?`<button class="btn tag sm" onclick="resolveIssue('${i.id}')">Sorted out</button>`:''}

  </div>`;
}
function logCheckin(cid){
  const c=custOf(cid); if(!c) return;
  modal('Ask '+c.name+' what they need',
    'The standing question, every '+askGap()+' days. If the farm is running fine, say so \u2014 that is an answer too.',[
    {k:'date',label:'Date asked',type:'date',req:true,val:todayISO()},
    {k:'any',label:'Is there a problem or a need right now?',type:'select',val:'yes',
      opts:[['yes','Yes \u2014 let me record it'],['no','No \u2014 the farm is running fine']]},
    {k:'note',label:'What they said',type:'textarea',ph:'their own words, if it helps'}
  ],'Save',o=>{
    c.askedAt=o.date; c.askedBy=who(); if(o.note) c.askedNote=o.note;
    db.visits.push({id:uid('vs'),date:o.date,custId:cid,adoId:c.adoId,purpose:'needs',
      outcome:o.any==='yes'?'problem':'info',note:o.note||'Asked what they need \u2014 nothing raised.',
      by:who(),at:new Date().toISOString()});
    save();
    if(o.any==='yes') askIssue(cid);
    else { toast('Noted \u2014 nothing needed right now.'); render(); }
  });
}
function askIssue(custId,editId){
  const i=editId?db.issues.find(x=>x.id===editId):null;
  const c=custOf(custId||(i?i.custId:''));
  modal(i?'Edit the record':'What is the problem?',
    c?'On '+c.name+'\u2019s farm. Record it even when we cannot fix it \u2014 the pattern across the area is what the office needs to see.':'',
    clean([
    custPickerField('custId','Whose farm?',i?i.custId:(custId||'')),
    {k:'date',label:'Date raised',type:'date',req:true,val:i?i.date:todayISO()},
    {k:'cat',label:'The problem',type:'select',req:true,val:i?i.cat:'growth',
      opts:Object.entries(ISSUECAT).map(([k,v])=>[k,v])},
    {k:'severity',label:'How bad is it?',type:'select',val:i?i.severity:'med',
      opts:[['high','Urgent \u2014 losing animals or money now'],['med','Needs attention'],['low','Minor']]},
    {k:'detail',label:'In their own words',type:'textarea',val:i?i.detail:'',
      ph:'e.g. 8 weanlings scouring since last week, dealer out of Scourex'},
    {k:'needKind',label:'What would actually help them?',type:'select',val:i?i.needKind:'',
      opts:[['','\u2014 nothing to supply, just noting it \u2014']].concat(Object.entries(NEEDKIND).map(([k,v])=>[k,v])),
      hint:'Anything you pick here lands on the demand board for the supervisor and manager.'},
    {k:'needQty',label:'How much?',type:'number',val:i?i.needQty:'',min:0},
    {k:'needUnit',label:'Unit',val:i?i.needUnit:'',ph:'bags, bottles, sachets, heads, visits\u2026'},
    {k:'needBy',label:'Needed by',type:'date',val:i?i.needBy:addD(todayISO(),14)},
    adoField('adoId',i?i.adoId:'')
  ]),'Save',o=>{
    o.adoId=withAdo(o)||(custOf(o.custId)||{}).adoId||'';
    if(i) Object.assign(i,o);
    else{
      db.issues.push(Object.assign({id:uid('is'),status:'open',by:who(),at:new Date().toISOString()},o));
      const cc=custOf(o.custId); if(cc){ cc.askedAt=o.date; cc.askedBy=who(); }
    }
    save(); toast(o.needKind?'Logged \u2014 it is on the demand board now.':'Logged.'); render();
  }, i?`<div class="card tight" style="border-color:#EFC7C1"><button class="btn danger sm wide"
      onclick="closeModal();delRec('issues','${i.id}')">Delete this record</button></div>`:'');
}
function resolveIssue(id){
  const i=db.issues.find(x=>x.id===id); if(!i) return;
  modal('Sorted out','What actually fixed it? This is the answer you give the next farm with the same problem.',[
    {k:'resolution',label:'What was done',type:'textarea',req:true,
      ph:'e.g. switched starter to ours and dosed with Scourex \u2014 scouring stopped in 4 days'}
  ],'Save',o=>{
    i.status='resolved'; i.resolution=o.resolution; i.resolvedAt=new Date().toISOString(); i.resolvedBy=who();
    save(); toast('Closed.'); render();
  });
}
function bookNeed(id,kind){
  const list=id?[db.issues.find(x=>x.id===id)].filter(Boolean)
              :openNeeds().filter(x=>x.needKind===kind&&x.status==='open');
  if(!list.length) return toast('Nothing to book.');
  const qty=list.reduce((a,x)=>a+num(x.needQty),0);
  modal(list.length>1?'Book all '+list.length+' requests':'Mark as booked',
    (NEEDKIND[list[0].needKind]||'')+(qty?' \u00b7 '+nf(qty)+' '+(list[0].needUnit||''):''),[
    {k:'bookedWith',label:'Booked with whom?',req:true,ph:'dealer, distributor, vet, the office\u2026'},
    {k:'bookedAt',label:'Expected date',type:'date',val:addD(todayISO(),7)},
    {k:'note',label:'Notes',val:''}
  ],'Book it',o=>{
    list.forEach(x=>{ x.status='booked'; x.bookedWith=o.bookedWith; x.bookedAt=o.bookedAt;
      x.bookedBy=who(); if(o.note) x.bookNote=o.note; });
    save(); toast(list.length+' request'+(list.length===1?'':'s')+' booked. The ADO sees it now.'); render();
  });
}

/* ---- the list ---- */
function vIssues(){
  let list=db.issues.filter(inScope);
  if(FILTER==='open') list=list.filter(i=>i.status==='open');
  else if(FILTER==='urgent') list=list.filter(i=>i.severity==='high'&&i.status!=='resolved');
  else if(FILTER==='needs') list=list.filter(i=>i.needKind&&i.status!=='resolved');
  else if(FILTER==='booked') list=list.filter(i=>i.status==='booked');
  else if(FILTER==='resolved') list=list.filter(i=>i.status==='resolved');
  else list=list.filter(i=>i.status!=='resolved');
  list.sort((a,b)=>(b.severity==='high')-(a.severity==='high')||b.date.localeCompare(a.date));
  const all=db.issues.filter(inScope);
  const due=scopedCustomers().filter(dueForAsk);
  let h=pageHead('Problems and needs','What the farms are struggling with, and what they asked us for.',
    can('issues')?`<button class="btn sm" onclick="askIssue()">+ Log one</button>`:'');
  h+=scopePicker();
  h+=`<div class="grid3" style="margin-bottom:11px">
    <div class="stat"><b style="color:${all.filter(i=>i.severity==='high'&&i.status!=='resolved').length?'var(--alert)':'inherit'}">${all.filter(i=>i.severity==='high'&&i.status!=='resolved').length}</b><span>urgent</span></div>
    <div class="stat"><b>${all.filter(i=>i.status!=='resolved').length}</b><span>open</span></div>
    <div class="stat"><b>${all.filter(i=>i.status==='resolved').length}</b><span>sorted out</span></div></div>`;
  if(due.length) h+=`<div class="card" style="border-color:#EEDCAF;background:#FFFDF5">
    <b class="small">\u{1F91D} ${due.length} raiser${due.length===1?'':'s'} overdue for a check-in</b>
    <div class="tiny muted" style="margin:3px 0 8px">Nobody has asked them what they need in over ${askGap()} days.</div>
    <div class="row wrap">${due.slice(0,8).map(c=>
      `<button class="btn ghost sm" onclick="logCheckin('${c.id}')">${esc(c.name)}</button>`).join('')}
      ${due.length>8?`<span class="tiny muted">+${due.length-8} more</span>`:''}</div></div>`;
  h+=`<div class="chipbar">
    <button class="${FILTER!=='open'&&FILTER!=='urgent'&&FILTER!=='needs'&&FILTER!=='booked'&&FILTER!=='resolved'?'on':''}" onclick="setFilter('all')">Open</button>
    <button class="${FILTER==='urgent'?'on':''}" onclick="setFilter('urgent')">Urgent</button>
    <button class="${FILTER==='needs'?'on':''}" onclick="setFilter('needs')">Needs something</button>
    <button class="${FILTER==='booked'?'on':''}" onclick="setFilter('booked')">Booked</button>
    <button class="${FILTER==='resolved'?'on':''}" onclick="setFilter('resolved')">Sorted out</button></div>`;
  /* the pattern across the area, not just the individual complaints */
  const byCat={};
  all.filter(i=>i.status!=='resolved').forEach(i=>byCat[i.cat]=(byCat[i.cat]||0)+1);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length>1){
    const tot=cats.reduce((a,[,v])=>a+v,0);
    h+=`<div class="card tight"><b class="small">What this area is actually struggling with</b>
      ${cats.slice(0,6).map(([k,v])=>`<div class="comprow"><div class="spread">
        <span>${esc(ISSUECAT[k]||k)}</span><b>${v} farm${v===1?'':'s'}</b></div>
        <div class="bar"><i class="${v/tot>0.3?'r':'w'}" style="width:${pct(v,tot)}%"></i></div></div>`).join('')}
      <div class="small muted" style="margin-top:7px">A problem showing up on a third of the farms is not a farm problem.
      It is an area problem, and it usually has one answer that works everywhere.</div></div>`;
  }
  if(!list.length) return h+emptyBox('Nothing here',
    'Ask on every visit: what is hurting the farm, and what would help? Then log the answer.',
    can('issues')?'Log one':'','askIssue()');
  h+=`<div class="small muted" style="margin-bottom:7px">${list.length} shown</div>`;
  h+=list.map(i=>issueCard(i,true)).join('');
  return h;
}

/* ---- the demand board: what to pre-book ---- */
function demandBoard(){
  const out={};
  openNeeds().forEach(i=>{
    const k=i.needKind;
    out[k]=out[k]||{kind:k,n:0,qty:0,unit:'',by:null,brgys:new Set(),items:[],booked:0};
    const g=out[k]; g.n++; g.qty+=num(i.needQty); g.unit=g.unit||i.needUnit||'';
    if(i.status==='booked') g.booked++;
    if(i.needBy&&(!g.by||i.needBy<g.by)) g.by=i.needBy;
    const c=custOf(i.custId); if(c&&c.brgyId) g.brgys.add(brgyName(c.brgyId));
    g.items.push(i);
  });
  return Object.values(out).sort((a,b)=>(b.n-a.n)||(b.qty-a.qty));
}
function vDemand(){
  const board=demandBoard();
  const needs=openNeeds();
  const unbooked=needs.filter(i=>i.status==='open');
  let h=pageHead('Demand board','Everything the farms have asked for, gathered in one place so it can be booked before anybody runs out.');
  h+=scopePicker();
  h+=`<div class="aiwin ${unbooked.length?'hot':'open'}">
    <div class="lbl">${esc(scopeLabel())}</div>
    <div class="clock">${unbooked.length} <span style="font-size:15px;font-weight:600">request${unbooked.length===1?'':'s'} not yet booked</span></div>
    <div class="win">${needs.length} open in total \u00b7 ${board.length} different thing${board.length===1?'':'s'} being asked for
      ${needs.filter(i=>i.needBy&&i.needBy<todayISO()).length?' \u00b7 '+needs.filter(i=>i.needBy&&i.needBy<todayISO()).length+' already past the date promised':''}</div></div>`;
  if(!board.length) return h+emptyBox('Nothing asked for yet',
    'When an ADO logs a problem, they also pick what would help. Those land here.',
    can('issues')?'Log a problem':'','askIssue()');
  h+=board.map(g=>{
    const late=g.by&&g.by<todayISO();
    return `<div class="card"><div class="spread">
      <div style="flex:1;min-width:0"><b>${esc(NEEDKIND[g.kind]||g.kind)}</b>
        <div class="small muted">${g.n} farm${g.n===1?'':'s'}${g.qty?' \u00b7 '+nf(g.qty)+' '+esc(g.unit):''}
          ${g.by?` \u00b7 first needed <b${late?' style="color:var(--alert)"':''}>${fshort(g.by)}</b>`:''}</div>
        <div class="tiny muted" style="margin-top:2px">${[...g.brgys].slice(0,4).map(esc).join(', ')}${g.brgys.size>4?' +'+(g.brgys.size-4):''}</div></div>
      <div style="text-align:right"><b style="font-size:20px">${g.n}</b>
        <div class="tiny muted">${g.booked?g.booked+' booked':'none booked'}</div></div></div>
      <div class="bar"><i class="${g.booked===g.n?'':'r'}" style="width:${pct(g.booked,g.n)}%"></i></div>
      <div class="row wrap" style="margin-top:9px">
        ${can('demand')&&g.booked<g.n?`<button class="btn sm" onclick="bookNeed(null,'${g.kind}')">Book all ${g.n-g.booked}</button>`:''}
        ${g.items.slice(0,5).map(i=>`<button class="btn ghost sm" onclick="go('customer','${i.custId}')">${esc(custName(i.custId).split(' ').slice(0,2).join(' '))}</button>`).join('')}
        ${g.items.length>5?`<span class="tiny muted">+${g.items.length-5}</span>`:''}</div></div>`;}).join('');
  /* by barangay, so a delivery run can be planned */
  const byB={};
  needs.forEach(i=>{const c=custOf(i.custId); if(!c||!c.brgyId) return;
    (byB[c.brgyId]=byB[c.brgyId]||[]).push(i);});
  const brows=Object.entries(byB).sort((a,b)=>b[1].length-a[1].length);
  if(brows.length>1) h+=`<div class="sect-head"><h2>Where it has to go</h2></div><div class="card tight scrollx">
    <table class="matrix"><thead><tr><th>Barangay</th><th>Requests</th><th>Farms</th><th>Not booked</th></tr></thead><tbody>
    ${brows.map(([bid,items])=>`<tr><td>${esc(brgyName(bid))}</td><td>${items.length}</td>
      <td>${new Set(items.map(i=>i.custId)).size}</td>
      <td style="color:${items.filter(i=>i.status==='open').length?'var(--alert)':'var(--good)'}">${items.filter(i=>i.status==='open').length}</td></tr>`).join('')}
    </tbody></table></div>`;
  if(can('demand')) h+=`<div class="card"><b class="small">\u{1F4C4} Proposal for the dealers and distributors</b>
    <div class="small muted" style="margin:4px 0 8px">Everything above, written out. Copy it into a message or an email.</div>
    <div class="code" id="proposalBox">${esc(proposalText())}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="copyProposal()">Copy it</button>
    <button class="btn ghost sm" onclick="dl('atlas-proposal-'+todayISO()+'.txt',proposalText(),'text/plain')">Download</button></div></div>`;
  return h;
}
function proposalText(){
  const needs=openNeeds();
  const todo=needs.filter(i=>i.status==='open');
  const grouped={};
  todo.forEach(i=>{ const k=i.needKind;
    grouped[k]=grouped[k]||{n:0,qty:0,unit:'',by:null,brgys:new Set()};
    const g=grouped[k]; g.n++; g.qty+=num(i.needQty); g.unit=g.unit||i.needUnit||'';
    if(i.needBy&&(!g.by||i.needBy<g.by)) g.by=i.needBy;
    const c=custOf(i.custId); if(c&&c.brgyId) g.brgys.add(brgyName(c.brgyId)); });
  const rows=Object.entries(grouped).sort((a,b)=>b[1].n-a[1].n);
  const L=[];
  L.push(db.meta.org);
  L.push('FIELD DEMAND \u2014 '+scopeLabel()+' \u2014 '+fdate(todayISO()));
  L.push('');
  L.push('Gathered from '+new Set(needs.map(n=>n.custId)).size+' farms by our ADOs on the ground.');
  L.push('');
  if(rows.length){
    L.push('STILL TO BE BOOKED');
    rows.forEach(([k,g])=>{
      L.push('  \u2022 '+(NEEDKIND[k]||k)+' \u2014 '+g.n+' farm'+(g.n===1?'':'s')
        +(g.qty?', '+nf(g.qty)+' '+(g.unit||''):'')
        +(g.by?', first needed '+fdate(g.by):''));
      L.push('      Barangays: '+[...g.brgys].join(', '));
    });
  } else L.push('Every request on the board has been booked.');
  const booked=needs.filter(i=>i.status==='booked');
  if(booked.length){
    L.push('');
    L.push('ALREADY BOOKED \u2014 '+booked.length+' request'+(booked.length===1?'':'s'));
    [...new Set(booked.map(i=>i.bookedWith).filter(Boolean))].forEach(w=>
      L.push('  \u2022 '+w+' \u2014 '+booked.filter(i=>i.bookedWith===w).length+' item'
        +(booked.filter(i=>i.bookedWith===w).length===1?'':'s')));
  }
  L.push('');
  const byCat={};
  openIssues().forEach(i=>byCat[i.cat]=(byCat[i.cat]||0)+1);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(cats.length){
    L.push('WHAT THE FARMS ARE STRUGGLING WITH');
    cats.forEach(([k,v])=>L.push('  \u2022 '+(ISSUECAT[k]||k)+' \u2014 '+v+' farm'+(v===1?'':'s')));
    L.push('');
  }
  const k=kpis();
  L.push('THE MARKET BEHIND IT');
  L.push('  Mapped: '+k.mapped+' farms, '+nf(k.heads)+' heads, '+nf(k.potential)+' bags a month.');
  L.push('  Our share today: '+k.share+'%. Still with other brands: '+nf(k.gap)+' bags a month.');
  L.push('');
  L.push('Meeting these requests is how the rest of that volume moves. A farm that gets');
  L.push('answered when it has a problem does not shop around when it is time to reorder.');
  return L.join('\n');
}

function csvIssues(){

function pinHash(pin,id){ let h=0; const str=String(pin)+'|'+id;
  for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h.toString(36); }
function byUser(name){ const q=String(name||'').trim().toLowerCase();
  return db.users.find(u=>(u.username||'').toLowerCase()===q); }
function slug(name){ return String(name||'').trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9]/g,'')||'user'; }
function freeUser(base,skipId){ let u=base,n=1;
  while(db.users.some(x=>x.id!==skipId&&(x.username||'').toLowerCase()===u)){ n++; u=base+n; } return u; }
function migrateUsers(){
  let t=false;
  db.users.forEach(u=>{ if(!u.username){ u.username=freeUser(slug(u.name),u.id); t=true; }
    if(u.role==='admin'){ u.role='manager'; t=true; } });
  if(t) save();
}
function signIn(u){
  SESSION={id:u.id,name:u.name,role:u.role};
  db.meta.encoder=u.name; u.lastIn=new Date().toISOString();
  db.logins.push({id:uid('li'),at:u.lastIn,user:u.name,role:u.role});
  if(db.logins.length>300) db.logins=db.logins.slice(-300);
  try{ localStorage.setItem('atlas_sess',u.id); }catch(e){}
  VIEW='dash'; SUB=null; AREAF='all'; ADOF='all'; MONTH=null;
  save(); render(); toast('Welcome, '+u.name.split(' ')[0]+'.');
}
function signOut(){ SESSION=null; try{ localStorage.removeItem('atlas_sess'); }catch(e){} VIEW='dash'; render(); }
function restoreSession(){
  let id=null; try{ id=localStorage.getItem('atlas_sess'); }catch(e){}
  const u=id?userOf(id):null;
  if(u&&u.active!==false){ SESSION={id:u.id,name:u.name,role:u.role}; db.meta.encoder=u.name; }
}

/* ============================================================
   CLOUD SYNC (Supabase REST)
   ============================================================ */
const CKEY='atlas_cloud2';
const SYNCABLE=['users','logins','areas','barangays','customers','issues','sales','visits','followups',
  'routes','opps','competitors','targets','products','coaching','awards','notes'];
let CLOUD=null, SYNC={s:'off',msg:'Not connected',at:null}, syncTimer=null, syncing=false;
function loadCloud(){ try{ const r=localStorage.getItem(CKEY); if(r) CLOUD=JSON.parse(r); }catch(e){} }
function storeCloud(){ try{ CLOUD?localStorage.setItem(CKEY,JSON.stringify(CLOUD)):localStorage.removeItem(CKEY); }catch(e){} }
function cloudOn(){ return !!(CLOUD&&CLOUD.url&&CLOUD.key&&CLOUD.team); }
function syncChip(){
  const b=$('syncBtn'); if(!b) return;
  b.className='synced'+(SYNC.s==='ok'?' ok':SYNC.s==='bad'?' bad':(SYNC.s==='busy'||SYNC.s==='wait')?' busy':'');
  b.textContent=SYNC.s==='ok'?'\u25cf':SYNC.s==='busy'?'\u25cc':SYNC.s==='wait'?'\u2191':SYNC.s==='bad'?'!':'\u25cb';
  b.title=SYNC.msg;
}
function setSync(st,msg){ SYNC.s=st; SYNC.msg=msg; if(st==='ok') SYNC.at=new Date().toISOString(); syncChip(); }
async function api(path,opts){
  const base=CLOUD.url.replace(/\/+$/,'');
  const r=await fetch(base+'/rest/v1/'+path, Object.assign({
    headers:{apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key,
      'Content-Type':'application/json',Prefer:'return=representation'}}, opts||{}));
  const txt=await r.text();
  if(!r.ok) throw new Error('HTTP '+r.status+' '+txt.slice(0,140));
  return txt?JSON.parse(txt):null;
}
function mergeDB(local,remote,remoteNewer){
  const out=Object.assign({},local);
  out.meta=remoteNewer?Object.assign({},local.meta,remote.meta||{}):Object.assign({},remote.meta||{},local.meta);
  const tombs=new Set((local.tombs||[]).concat(remote.tombs||[]));
  SYNCABLE.forEach(k=>{
    const first=remoteNewer?(local[k]||[]):(remote[k]||[]);
    const second=remoteNewer?(remote[k]||[]):(local[k]||[]);
    const map=new Map();
    first.concat(second).forEach(x=>{ if(x&&x.id&&!tombs.has(x.id)) map.set(x.id,x); });
    out[k]=[...map.values()];
  });
  out.tombs=[...tombs].slice(-4000);
  if(out.logins&&out.logins.length>300) out.logins=out.logins.slice(-300);
  return out;
}
function queueSync(){
  if(!cloudOn()) return;
  CLOUD.dirty=true; storeCloud();
  if(SYNC.s!=='busy') setSync('wait','Saving to the cloud\u2026');
  clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(true),1500);
}
async function syncNow(silent){
  if(!cloudOn()||syncing) return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){ setSync('bad','No signal \u2014 will sync later'); return; }
  syncing=true; setSync('busy','Syncing\u2026');
  try{
    const rows=await api('atlas_state?id=eq.'+encodeURIComponent(CLOUD.team)+'&select=rev,data,updated_at,updated_by');
    const row=rows&&rows[0];
    let rev=CLOUD.rev||0, changed=!row, pulled=false;
    if(row){ if(row.rev!==CLOUD.rev){ db=mergeDB(db,row.data||{},!CLOUD.dirty); changed=true; pulled=true; } rev=row.rev; }
    if(changed||CLOUD.dirty){
      const body=[{id:CLOUD.team,rev:rev+1,data:db,updated_at:new Date().toISOString(),
        updated_by:(SESSION?SESSION.name:'device')}];
      const saved=await api('atlas_state?on_conflict=id',{method:'POST',
        headers:{apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key,'Content-Type':'application/json',
          Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});
      CLOUD.rev=(saved&&saved[0]?saved[0].rev:rev+1);
    } else CLOUD.rev=rev;
    migrateUsers();
    CLOUD.dirty=false; CLOUD.lastAt=new Date().toISOString(); storeCloud();
    try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){}
    setSync('ok','Synced '+ftime(CLOUD.lastAt));
    if(!silent) toast('Everything is in step.');
    /* only redraw when something actually arrived, so a quiet background sync
       never interrupts somebody mid-form */
    if(pulled||!silent){ if(SESSION||!db.users.length) render(); }
  }catch(e){
    if(CLOUD){ CLOUD.dirty=true; storeCloud(); }
    setSync('bad','Not sent yet: '+e.message);
    if(!silent) toast('Sync failed. '+e.message);
  }finally{ syncing=false; }
}
function syncCode(){ if(!cloudOn()) return '';
  try{ return btoa(JSON.stringify({u:CLOUD.url,k:CLOUD.key,f:CLOUD.team})); }catch(e){ return ''; } }
function connectCloud(url,key,team){
  CLOUD={url:url.trim(),key:key.trim(),team:(team||('atlas_'+uid('')+uid(''))).trim(),rev:0,dirty:true};
  storeCloud(); syncNow();
}
function vCloud(){
  const on=cloudOn();
  let h=backTo('more','More')+pageHead('Cloud sync',
    'Keeps every phone on the same records. Each phone still works with no signal and catches up later.');
  if(on) h+=`<div class="card"><div class="spread"><div><b>${CLOUD.dirty?'Connected \u00b7 something still to send':'Connected'}</b>
      <div class="small muted">${esc(SYNC.msg)}</div>
      <div class="tiny muted">It sends by itself a moment after you save, when you switch back to the app,
      when signal returns, and every 45 seconds.</div></div>
      <button class="btn sm" onclick="syncNow()">Sync now</button></div>
      <hr class="sep">
      <div class="small"><span class="muted">Team code:</span> ${esc(CLOUD.team)}</div>
      <div class="small"><span class="muted">Last change by:</span> ${esc((db.meta&&db.meta.encoder)||'\u2014')}</div></div>
    <div class="card"><b class="small">Add another phone</b>
      <div class="small muted" style="margin:4px 0 8px">Open this same web address on the other phone, go to
      More \u2192 Cloud sync \u2192 Paste a sync code, and paste the code below. Keep it private.</div>
      <div class="code" id="scode">${esc(syncCode())}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" onclick="copyCode()">Copy the code</button>
        <button class="btn ghost sm" onclick="disconnectCloud()">Disconnect this phone</button></div></div>`;
  else h+=`<div class="card"><b class="small">This phone is not connected</b>
      <div class="small muted" style="margin:4px 0 10px">Records stay on this phone only.</div>
      <button class="btn wide" style="margin-bottom:8px" onclick="askJoin()">Paste a sync code</button>
      <button class="btn ghost wide" onclick="askCloudSetup()">Set up the first connection</button></div>
    <div class="card small"><b>How the first connection is made</b>
      <div class="muted" style="margin-top:5px">Make a free project at supabase.com, open the SQL editor, run the few
      lines in the setup screen, then copy the Project URL and the anon key into this app. One phone does this once;
      the rest just paste the sync code.</div></div>`;
  return h;
}
function copyCode(){
  const t=syncCode();
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('Code copied.'),()=>toast('Press and hold the code to copy.'));
  else toast('Press and hold the code to copy.');
}
function disconnectCloud(){
  confirmBox('Stop syncing on this phone? The records already here stay.',()=>{
    CLOUD=null; storeCloud(); setSync('off','Not connected'); toast('Disconnected.'); render(); });
}
function askJoin(){
  modal('Paste a sync code','Get this from the phone that is already connected: More \u2192 Cloud sync.',
   [{k:'c',label:'Sync code',type:'textarea',req:true,ph:'a long line of letters and numbers'}],
   'Connect',o=>{
     let d=null; try{ d=JSON.parse(atob(o.c.trim())); }catch(e){}
     if(!d||!d.u||!d.k||!d.f) return toast('That code is not readable. Copy the whole line.');
     connectCloud(d.u,d.k,d.f); toast('Connecting\u2026');
     if(SESSION) go('cloud'); else render();
   });
}
function askCloudSetup(){
  const sql='create table if not exists atlas_state (\n'+
    '  id text primary key,\n  rev int default 0,\n  data jsonb,\n'+
    '  updated_at timestamptz default now(),\n  updated_by text\n);\n'+
    'alter table atlas_state enable row level security;\n'+
    'create policy atlas_rw on atlas_state for all to anon using (true) with check (true);';
  modal('Connect to Supabase','Do this once, on one phone. The other phones only need the sync code afterwards.',[
    {k:'url',label:'Project URL',req:true,ph:'https://abcdefgh.supabase.co',hint:'Supabase \u2192 Project settings \u2192 Data API'},
    {k:'key',label:'anon public key',req:true,ph:'eyJhbGciOi\u2026',hint:'Same page, under Project API keys. Use the anon key, never the service key.'},
    {k:'team',label:'Team code',val:'atlas_'+uid('')+uid(''),hint:'A private name for your records. Keep it long.'}
  ],'Connect',o=>{ connectCloud(o.url,o.key,o.team); toast('Connecting\u2026'); go('cloud'); },
  `<div class="card tight"><b class="small">1. Run this in the Supabase SQL editor</b>
   <div class="code" style="margin-top:6px">${esc(sql)}</div></div>`);
}
/* ============================================================ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MODAL) closeModal(); });
$('encoderBtn').onclick=()=>{ if(SESSION) accountMenu(); };
$('syncBtn').onclick=()=>{ if(cloudOn()) syncNow(); else { if(SESSION) go('cloud'); else askJoin(); } };
if(typeof document!=='undefined'&&document.addEventListener) document.addEventListener('visibilitychange',()=>syncNow(true));
try{
  window.addEventListener('online',()=>syncNow(true));
  window.addEventListener('focus',()=>{ if(CLOUD&&CLOUD.dirty) syncNow(true); });
  window.addEventListener('pagehide',()=>{ if(CLOUD&&CLOUD.dirty) syncNow(true); });
}catch(e){}
setInterval(()=>syncNow(true),45000);
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
load().then(()=>{ loadCloud(); migrateUsers(); restoreSession(); render(); syncChip();
  if(cloudOn()){ setSync('busy','Syncing\u2026'); syncNow(true); } });
